name: windows-app

# Builds the Windows installer. Run by hand (Actions > windows-app > Run workflow) for a test build
# to download from the run's artifacts; pushing a tag like v0.2.0 also runs the tests alongside the
# build and, only if both pass, publishes it as a release, which the app's "Check for updates" offers.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = "0.0.0.dev${{ github.run_number }}" }
          "VERSION=$v" >> $env:GITHUB_ENV
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: pip cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-windows-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-windows-
      - name: Build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools\windows\build.ps1 -Version $env:VERSION
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $exe = "dist\Shotcast-Setup-$env:VERSION.exe"
          Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/nolaunch=1", "/LOG=install.log" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Shotcast"
          & "$app\python\python.exe" -m commentator tray --home "$env:RUNNER_TEMP\shotcast-home" --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }
          # The tray's Command prompt puts python\Scripts on PATH: `shotcast` must run from the installed copy.
          if (Test-Path "$app\python\Scripts\shotcast.exe") { throw "shotcast.exe runs the build machine's Python" }
          & cmd /c "`"$app\python\Scripts\shotcast.cmd`" --help" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "no shotcast command for the Command prompt" }
          if (-not (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name Shotcast -ErrorAction SilentlyContinue)) { throw "no Start with Windows entry" }
          if ((Get-ItemProperty "HKCU:\Software\Shotcast" -Name CheckForUpdates -ErrorAction SilentlyContinue).CheckForUpdates -ne 1) { throw "update checks not on" }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          # The uninstaller runs a copy of itself and returns at once: wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\python"); $i++) { Start-Sleep 2 }
          if (Test-Path "$app\python") { Get-ChildItem "$app" -Recurse | Select-Object -First 20 FullName; throw "uninstall left the app behind" }
      - uses: actions/upload-artifact@v7
        with:
          name: Shotcast-Setup-${{ env.VERSION }}
          path: dist/*

  release:
    needs: [tests, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Shotcast-Setup-${{ needs.build.outputs.version }}
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          hash=$(cut -d' ' -f1 "dist/Shotcast-Setup-$VERSION.exe.sha256")
          readme=https://github.com/jjmerri/gspro-shotcast#the-windows-app-easiest
          privacy=https://github.com/jjmerri/gspro-shotcast/blob/main/PRIVACY.md
          notes=$(printf 'Download **Shotcast-Setup-%s.exe** and run it (see the [README](%s)).\n\nSHA-256: `%s`\n\n[Privacy policy](%s)' \
            "$VERSION" "$readme" "$hash" "$privacy")
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Shotcast $GITHUB_REF_NAME" \
            --notes "$notes" --generate-notes
