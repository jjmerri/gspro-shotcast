[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotcast-scoring"
version = "0.6.0"
description = "Shotcast's league scoring rules: handicap strokes, team nets, places, points and standings"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["shotcast_scoring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
