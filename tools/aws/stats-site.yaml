AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GSPro Shotcast stats page: a private S3 bucket served through CloudFront behind one shared
  username and password, plus an IAM user that can only upload to the bucket, and the live chat
  that feeds the booth (a small function and table under /chat/, behind the same password).
  See docs/tracking.md#sharing-the-stats-page and docs/tracking.md#live-chat.

Parameters:
  SiteUser:
    Type: String
    Default: league
    AllowedPattern: "[A-Za-z0-9._-]+"
    Description: Username for the stats page.
  SitePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    AllowedPattern: "[A-Za-z0-9._~!@#%^*+=-]+"
    ConstraintDescription: 8+ characters; letters, digits and ._~!@#%^*+=- only.
    Description: Password for the stats page (shared with the league).
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Optional custom domain (e.g. thegolfshed.app). Needs CertificateArn. Every other host, the
      www name and the cloudfront.net address included, redirects to it.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate in us-east-1 covering DomainName and www.DomainName.
  LoginDays:
    Type: Number
    Default: 365
    MinValue: 1
    MaxValue: 400
    Description: >-
      Days a browser stays signed in after entering the password (a cookie; browsers cap it at
      400). Changing the password signs every browser out.

  ChatKeepHours:
    Type: Number
    Default: 6
    MinValue: 1
    MaxValue: 168
    Description: Hours a live chat message is kept (the table deletes it after).

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # The live stream (live_stream.py) keeps each stream live.keep_days (7) for the Round replays tab, a
      # league round's till a week past its week's deadline (for the week's recap; teams play weeks
      # early, so that can be months), and then deletes it; this catches any it missed, after a season
      # (a crash's leftovers the booth doesn't clear when it next starts). With live.keep_days 0 it deletes its
      # video as it goes, and this only catches what a crash left. With a publish.prefix, the stream is
      # under <prefix>/live/s/ instead: change it to match.
      LifecycleConfiguration:
        Rules:
          - Id: live-stream-leftovers
            Status: Enabled
            Prefix: live/s/
            ExpirationInDays: 180

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Runs at the edge on every request, before the cache: no password (or sign-in cookie), no page.
  BasicAuth:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-basic-auth"
      AutoPublish: true
      FunctionConfig:
        Comment: Shared username and password for the stats page
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          var crypto = require("crypto");
          // The sign-in cookie: a keyed hash of the password, so it can't be read back into one and
          // a new password invalidates it. Set by SignInCookie once the password is accepted.
          function signedIn(request) {
            var c = request.cookies.stats_login;
            return !!c && c.value === crypto.createHmac("sha256", "${Token}").update("stats-login").digest("hex");
          }
          function handler(event) {
            var domain = "${Domain}";
            var host = event.request.headers.host ? event.request.headers.host.value : "";
            if (domain && host !== domain) {
              return {
                statusCode: 301,
                statusDescription: "Moved Permanently",
                headers: { location: { value: "https://" + domain + event.request.uri } }
              };
            }
            // The home-screen app's files: a phone fetches them without the sign-in (they hold nothing).
            var uri = event.request.uri;
            if (uri === "/manifest.webmanifest" || uri === "/sw.js" || uri.indexOf("/icons/") === 0) {
              return event.request;
            }
            var auth = event.request.headers.authorization;
            if (signedIn(event.request) || (auth && auth.value === "Basic ${Token}")) {
              return event.request;
            }
            return {
              statusCode: 401,
              statusDescription: "Unauthorized",
              headers: { "www-authenticate": { value: 'Basic realm="Season stats", charset="UTF-8"' } }
            };
          }
        - Token: !Base64
            Fn::Sub: "${SiteUser}:${SitePassword}"
          Domain: !Ref DomainName

  # After a request let in by the password, keeps the browser signed in for LoginDays with a
  # cookie, so it isn't asked again every time it forgets the password (phones do, often).
  SignInCookie:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-sign-in-cookie"
      AutoPublish: true
      FunctionConfig:
        Comment: Keeps a browser signed in to the stats page after the password
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          var crypto = require("crypto");
          function handler(event) {
            var request = event.request, response = event.response;
            var auth = request.headers.authorization;
            if (!auth || auth.value !== "Basic ${Token}" || response.statusCode >= 400) {
              return response;
            }
            var value = crypto.createHmac("sha256", "${Token}").update("stats-login").digest("hex");
            var c = request.cookies.stats_login;
            if (c && c.value === value) {
              return response;
            }
            response.cookies = response.cookies || {};
            response.cookies.stats_login = {
              value: value,
              attributes: "Path=/; Max-Age=" + (${Days} * 86400) + "; Secure; HttpOnly; SameSite=Lax"
            };
            return response;
          }
        - Token: !Base64
            Fn::Sub: "${SiteUser}:${SitePassword}"
          Days: !Ref LoginDays

  # ---- Live chat (docs/tracking.md#live-chat) ---------------------------------------------------
  # Viewers post from the page (POST /chat/messages) and read it (GET); the booth heartbeats into the
  # table while it's commentating a round, reads new messages straight from the table, and marks the
  # ones it answered. Rows: pk "booth"/sk "state" (the heartbeat), pk "msg"/sk "<ms>-<rand>" (a
  # message), pk "rate"/sk "<key>" (rate-limit counts). All but the heartbeat expire on their ttl.
  # Alerts (docs/tracking.md#alerts): pk "push"/sk "key" (the booth's public push key) and pk "push"/
  # sk "sub#<hash>" (a phone's subscription, posted to /chat/push), which don't expire.
  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ChatRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: chat
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt ChatTable.Arn

  Chat:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ChatRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE: !Ref ChatTable
          # CloudFront sends this on every request; anything without it (the function URL called
          # directly, around the password) is turned away.
          ORIGIN_SECRET: !Select [2, !Split ["/", !Ref AWS::StackId]]
          KEEP_HOURS: !Sub "${ChatKeepHours}"
      Code:
        ZipFile: |
          import base64, hashlib, json, os, re, secrets, time
          from urllib.parse import urlsplit
          import boto3

          db = boto3.client("dynamodb")
          TABLE = os.environ["TABLE"]
          KEEP = int(os.environ["KEEP_HOURS"]) * 3600
          BOOTH_FRESH = 90        # seconds a booth heartbeat counts as on air
          NAME_MAX, TEXT_MAX, SHOWN = 24, 200, 50
          # (window seconds, most posts in it): per viewer, then everyone together.
          PER_IP = ((10, 2), (600, 30))
          PER_ALL = ((60, 60),)

          def reply(status, body):
              return {"statusCode": status, "headers": {"content-type": "application/json", "cache-control": "no-store"},
                      "body": json.dumps(body)}

          def clean(text, most):
              text = re.sub(r"[\x00-\x1f\x7f\u200b-\u200f\u2028-\u202e\u2066-\u2069]", " ", str(text or ""))
              return " ".join(text.split())[:most]

          def booth(now):
              """The booth's state while it's on air, else None."""
              item = db.get_item(TableName=TABLE, Key={"pk": {"S": "booth"}, "sk": {"S": "state"}}).get("Item")
              on = bool(item) and item.get("on", {}).get("BOOL") is True and now - int(item["at"]["N"]) <= BOOTH_FRESH
              return item if on else None

          def count(key, window, limit, now):
              """One more post in key's current window, unless it's full: False when it is."""
              try:
                  db.update_item(TableName=TABLE, Key={"pk": {"S": "rate"}, "sk": {"S": f"{key}#{window}#{now // window}"}},
                                 UpdateExpression="ADD n :one SET #t = :ttl",
                                 ConditionExpression="attribute_not_exists(n) OR n < :limit",
                                 ExpressionAttributeNames={"#t": "ttl"},
                                 ExpressionAttributeValues={":one": {"N": "1"}, ":limit": {"N": str(limit)},
                                                            ":ttl": {"N": str(now + window + 3600)}})
                  return True
              except db.exceptions.ConditionalCheckFailedException:
                  return False

          def viewer_ip(event):
              addr = (event.get("headers") or {}).get("cloudfront-viewer-address", "")
              return addr.rsplit(":", 1)[0] if addr else event.get("requestContext", {}).get("http", {}).get("sourceIp", "?")

          def number(x, top):
              return isinstance(x, (int, float)) and not isinstance(x, bool) and 0 <= x <= top

          def watching(w):
              """What the viewer was watching as they sent it: the stream's segment and how far into it,
              or (a player that won't say) how far behind the live edge. Stored for the booth only."""
              if not isinstance(w, dict) or not isinstance(sess := w.get("sess"), str) or not re.fullmatch(r"[\w.-]{1,40}", sess):
                  return {}
              seg = w.get("seg")
              if isinstance(seg, str) and re.fullmatch(r"[\w.-]{1,40}\.(?:ts|m4s)", seg) and number(w.get("off"), 60):
                  return {"sess": {"S": sess}, "seg": {"S": seg}, "off": {"N": f"{w['off']:.2f}"}}
              if number(w.get("behind"), 600):
                  return {"sess": {"S": sess}, "behind": {"N": f"{w['behind']:.2f}"}}
              return {}

          def message(item):
              return {"id": item["sk"]["S"], "name": item["name"]["S"], "text": item["text"]["S"],
                      "at": int(item["sk"]["S"].split("-")[0]) / 1000, "aired": item.get("aired", {}).get("BOOL") is True}

          def messages(now, after, state):
              # Only this round's: nothing from before its chat opened (the booth's "since").
              since = state.get("since", {}).get("S", "")
              since = since if re.fullmatch(r"\d{13}-[0-9a-f]{0,6}", since) else ""
              floor = max(after, since, f"{(now - KEEP) * 1000:013d}")
              args = {"TableName": TABLE, "KeyConditionExpression": "pk = :p AND sk > :s",
                      "ExpressionAttributeValues": {":p": {"S": "msg"}, ":s": {"S": floor}},
                      "ScanIndexForward": False, "Limit": SHOWN}
              items = db.query(**args).get("Items", [])
              return [message(i) for i in reversed(items) if int(i["ttl"]["N"]) > now]

          def post(event, now):
              body = event.get("body") or ""
              if event.get("isBase64Encoded"):
                  body = base64.b64decode(body).decode("utf-8", "replace")
              try:
                  data = json.loads(body)
              except ValueError:
                  data = None
              if not isinstance(data, dict):
                  return reply(400, {"error": "Send a name and a message."})
              name, text = clean(data.get("name"), NAME_MAX), clean(data.get("text"), TEXT_MAX)
              if not name or not text:
                  return reply(400, {"error": "Send a name and a message."})
              if not booth(now):
                  return reply(409, {"error": "The booth is off air."})
              ip = viewer_ip(event)
              if not all(count(f"ip#{ip}", w, n, now) for w, n in PER_IP):
                  return reply(429, {"error": "Slow down a little: try again in a few seconds."})
              if not all(count("all", w, n, now) for w, n in PER_ALL):
                  return reply(429, {"error": "The chat is busy: try again in a minute."})
              sk = f"{int(time.time() * 1000):013d}-{secrets.token_hex(3)}"
              item = {"pk": {"S": "msg"}, "sk": {"S": sk}, "name": {"S": name}, "text": {"S": text},
                      "ttl": {"N": str(now + KEEP)}, **watching(data.get("watch"))}
              db.put_item(TableName=TABLE, Item=item)
              return reply(200, {"message": message(item)})

          # ---- alerts: phones' push subscriptions, which the booth sends to (commentator/push.py)
          PUSH_HOSTS = ("fcm.googleapis.com", "updates.push.services.mozilla.com", "web.push.apple.com",
                        ".notify.windows.com", ".push.apple.com")
          TOPICS = {"live", "round", "record", "recap"}
          MOST_PHONES = 1000

          def push_host(endpoint):
              try:
                  u = urlsplit(endpoint)
              except ValueError:
                  return False
              host = (u.hostname or "").lower()
              return u.scheme == "https" and not u.port and any(
                  host == h or (h.startswith(".") and host.endswith(h)) for h in PUSH_HOSTS)

          def phones():
              n, start = 0, None
              while True:
                  args = {"TableName": TABLE, "KeyConditionExpression": "pk = :p AND begins_with(sk, :s)",
                          "ExpressionAttributeValues": {":p": {"S": "push"}, ":s": {"S": "sub#"}}, "Select": "COUNT"}
                  if start:
                      args["ExclusiveStartKey"] = start
                  resp = db.query(**args)
                  n += resp.get("Count", 0)
                  start = resp.get("LastEvaluatedKey")
                  if not start:
                      return n

          def push(event, now):
              method = event.get("requestContext", {}).get("http", {}).get("method")
              if method == "GET":   # the booth's public key, to subscribe with (none: alerts aren't set up)
                  item = db.get_item(TableName=TABLE, Key={"pk": {"S": "push"}, "sk": {"S": "key"}}).get("Item")
                  return reply(200, {"key": item["public"]["S"] if item else None})
              if method != "POST":
                  return reply(405, {"error": "GET or POST"})
              body = event.get("body") or ""
              if event.get("isBase64Encoded"):
                  body = base64.b64decode(body).decode("utf-8", "replace")
              try:
                  data = json.loads(body)
              except ValueError:
                  data = None
              sub = data.get("subscription") if isinstance(data, dict) else None
              endpoint = sub.get("endpoint") if isinstance(sub, dict) else None
              if not isinstance(endpoint, str) or len(endpoint) > 1000 or not push_host(endpoint):
                  return reply(400, {"error": "Not a push subscription this site can send to."})
              if not count(f"push#{viewer_ip(event)}", 600, 20, now):
                  return reply(429, {"error": "Slow down a little: try again in a few minutes."})
              key = {"pk": {"S": "push"}, "sk": {"S": "sub#" + hashlib.sha256(endpoint.encode()).hexdigest()}}
              topics = data.get("topics")
              topics = sorted({t for t in topics if t in TOPICS}) if isinstance(topics, list) else []
              if not topics:   # every alert off: forget the phone
                  db.delete_item(TableName=TABLE, Key=key)
                  return reply(200, {"topics": []})
              keys = sub.get("keys") if isinstance(sub.get("keys"), dict) else {}
              p256dh, auth = keys.get("p256dh"), keys.get("auth")
              if not (isinstance(p256dh, str) and re.fullmatch(r"[A-Za-z0-9_-]{80,100}={0,2}", p256dh)
                      and isinstance(auth, str) and re.fullmatch(r"[A-Za-z0-9_-]{16,32}={0,2}", auth)):
                  return reply(400, {"error": "Not a push subscription this site can send to."})
              if not db.get_item(TableName=TABLE, Key=key).get("Item") and phones() >= MOST_PHONES:
                  return reply(429, {"error": "Too many phones have alerts on."})
              db.put_item(TableName=TABLE, Item={**key, "endpoint": {"S": endpoint}, "p256dh": {"S": p256dh.rstrip("=")},
                                                 "auth": {"S": auth.rstrip("=")}, "topics": {"SS": topics},
                                                 "at": {"N": str(now)}})
              return reply(200, {"topics": topics})

          def handler(event, context):
              headers = event.get("headers") or {}
              if not secrets.compare_digest(headers.get("x-chat-origin", ""), os.environ["ORIGIN_SECRET"]):
                  return reply(403, {"error": "Forbidden"})
              http = event.get("requestContext", {}).get("http", {})
              path = event.get("rawPath", "").rstrip("/")
              if path.endswith("/chat/push"):
                  return push(event, int(time.time()))
              if not path.endswith("/chat/messages"):
                  return reply(404, {"error": "Not found"})
              now = int(time.time())
              if http.get("method") == "POST":
                  return post(event, now)
              if http.get("method") != "GET":
                  return reply(405, {"error": "GET or POST"})
              state = booth(now)
              if not state:
                  return reply(200, {"on": False, "messages": []})
              after = (event.get("queryStringParameters") or {}).get("after") or ""
              after = after if re.fullmatch(r"\d{13}-[0-9a-f]{6}", after) else ""
              return reply(200, {"on": True, "messages": messages(now, after, state)})

  ChatUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Chat.Arn
      AuthType: NONE

  ChatUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Chat
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Function URLs made since October 2025 need this as well as InvokeFunctionUrl.
  ChatUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Chat
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # What CloudFront passes on to the chat function: the viewer's address (for the rate limits) and
  # the body's type, never the Host (a function URL answers only to its own) or the password.
  ChatRequests:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-chat"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [CloudFront-Viewer-Address, Content-Type]
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} stats page"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If
          - HasDomain
          - [!Ref DomainName, !Sub "www.${DomainName}"]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: chat
            DomainName: !Select [2, !Split ["/", !GetAtt ChatUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Chat-Origin
                HeaderValue: !Select [2, !Split ["/", !Ref AWS::StackId]]
        # The chat, behind the same password, never cached.
        CacheBehaviors:
          - PathPattern: /chat/*
            TargetOriginId: chat
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref ChatRequests
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt BasicAuth.FunctionMetadata.FunctionARN
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt BasicAuth.FunctionMetadata.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt SignInCookie.FunctionMetadata.FunctionARN

  # Only this distribution can read the bucket.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          # Database backups (backup.s3) share the bucket but are never served to the site.
          - Effect: Deny
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/backups/*"

  # The booth's keys: upload and clean up in this bucket, and read back the streams (record_clips.py
  # copies each record shot out of its stream before the stream goes), nothing else. Create its access key
  # after the stack (aws iam create-access-key), so the secret never passes through CloudFormation.
  Uploader:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: stats-site-upload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${Bucket.Arn}/*"
              # With a publish.prefix, the stream is under <prefix>/live/ instead: change it to match.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${Bucket.Arn}/live/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              # The live chat: the booth's heartbeat, reading new messages, marking the ones answered;
              # and the alerts: its push key, reading the phones' subscriptions, dropping the gone ones.
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt ChatTable.Arn

Outputs:
  Url:
    Description: The stats page
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}/"
      - !Sub "https://${Distribution.DomainName}/"
  DistributionDomain:
    Description: "With DomainName: the CNAME target for the domain and www (DNS only, not proxied)"
    Value: !GetAtt Distribution.DomainName
  BucketName:
    Description: "config.yaml: publish.bucket"
    Value: !Ref Bucket
  Region:
    Description: "config.yaml: publish.region"
    Value: !Ref AWS::Region
  ChatTable:
    Description: "config.yaml: chat.table"
    Value: !Ref ChatTable
  UploadUser:
    Description: "aws iam create-access-key --user-name <this>, then the keys go in the PC's .env"
    Value: !Ref Uploader
