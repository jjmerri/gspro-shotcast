# Copy to config.yaml and edit. This is the cloud setup the booth was built and tuned on: GPT for
# the fast calls, Claude for the pre-shot look and the round wraps, OpenAI voices. It needs
# OPENAI_API_KEY and ANTHROPIC_API_KEY in .env. Every call is one `provider`/`model` setting, so
# running a model or the voices on the PC itself instead is a line change (see the alternative
# blocks: Claude only with voices on the PC, or everything on the PC). docs/booth.md, "Choosing a
# setup", compares them.

# Optional league file. Leave it unset to run without a league: every round is practice and players
# go by the names on GSPro's setup screen. To add league features (roster, schedule, standings,
# handicaps), copy data/league.example.json to data/league.json, fill it in, and point here.
# league_file: data/league.json
history_file: data/history.json        # optional: earlier seasons (built by `import-league`)
log_dir: logs
process_priority: below_normal   # run under GSPro so OCR bursts don't stutter the game
# max_cpu_cores: 8               # optional hard cap on how many cores the booth may use

personas:
  pbp:
    name: Nigel
    style: >-
      Calm, polished British play-by-play voice. Describes the strike and the flight,
      builds tension on big moments, understated praise.
  color:
    name: Duke
    style: >-
      Opinionated former mini-tour grinder turned color analyst. Dry humor, reads the
      launch numbers like a coach, needles players about their tendencies, never mean.

llm:
  # Each kind of call gets the model that fits its latency and quality budget (docs/booth.md,
  # "Models and voices"). `effort: none` skips the model's reasoning (GPT) or thinking (Claude) for the lowest latency, and
  # `service_tier: fast` trims latency further for ~2x a tiny per-token price.
  # The spoken pre-shot line, reactions, and between-hole segments.
  live:    { provider: openai, model: gpt-6-luna, effort: none, service_tier: fast, max_tokens: 400 }
  # Every flight and result line for a shot, written at setup in one reply. Keep it its OWN block
  # with a roomy max_tokens: that reply carries ~8 flight + ~10 result lines, and a truncated reply
  # loses the whole shot's plan.
  flight:  { provider: openai, model: gpt-6-luna, effort: none, service_tier: fast, max_tokens: 900 }
  # The hazard read from a screenshot of the hole (needs screen.send_images: true).
  preshot: { provider: anthropic, model: claude-haiku-5-5, effort: low, vision: true, max_tokens: 900 }
  # The opener is raced against the course load, so it wants a fast model; the closer is fetched
  # on the last hole with its latency hidden, so it can take the richest one.
  opener:  { provider: anthropic, model: claude-sonnet-5-5, effort: low }
  closer:  { provider: anthropic, model: claude-opus-5-5, effort: low, max_tokens: 2000 }
  # segment: { ... }   # between-hole segments; omit to reuse `live`

  # --- Alternative: one key (Anthropic) -------------------------------------
  # Claude for every call, with Kokoro voices on the PC (set `tts: provider: kokoro` below), so
  # .env needs only ANTHROPIC_API_KEY. Replace `live` and `flight` above with these; `effort: none`
  # turns Claude's thinking off, which these short replies need to come back fast and whole.
  # live:   { provider: anthropic, model: claude-haiku-5-5, effort: none, max_tokens: 400 }
  # flight: { provider: anthropic, model: claude-haiku-5-5, effort: none, max_tokens: 900 }

  # --- Local alternative: models on the PC itself (no per-token cost) --------
  # Install Ollama (https://ollama.com), `ollama pull qwen3:8b`, then replace the blocks above.
  # Quality and speed are well below the cloud mix; the pre-shot hazard look needs a vision model
  # (e.g. gemma3:12b, ~8-10 GB of VRAM free next to GSPro) or leave `preshot` out.
  # live:   { provider: ollama, model: qwen3:8b, effort: null, service_tier: null, max_tokens: 400 }
  # flight: { provider: ollama, model: qwen3:8b, effort: null, service_tier: null, max_tokens: 900 }

tts:
  # openai (cloud, needs OPENAI_API_KEY) | google (cloud, GOOGLE_TTS_API_KEY) | kokoro (on the PC's CPU) | console (print only)
  provider: openai
  openai_voices:
    pbp: fable
    color: ballad
  speed: 1.05
  # Google's Chirp 3 HD voices instead: provider: google (needs the `cloud` extra). Streams with
  # ~0.2 s to first audio; $30 per 1M characters after 1M free each month.
  # google_voices:
  #   pbp: en-GB-Chirp3-HD-Iapetus
  #   color: en-US-Chirp3-HD-Orus
  # google_speaking_rate: 1.0
  # Voices on the PC instead (no key, no per-line cost, plainer delivery): provider: kokoro, after
  # `pip install -e ".[local]"` and downloading the two model files into models/ (docs/setup.md).
  # voices:             # Kokoro voice ids
  #   pbp: bm_george
  #   color: am_michael
  # kokoro_model: models/kokoro-v1.0.onnx
  # kokoro_voices: models/voices-v1.0.bin
  # openai_model: gpt-4o-mini-tts     # or pin a snapshot, e.g. gpt-4o-mini-tts-2025-03-20
  # Cloud voice (openai): only what airs is voiced, streamed so it starts at its first audio; a line
  # that misses its moment is dropped, never played late (docs/booth.md, "Voices").
  # prevoice: false                   # true: voice every possible call ahead (instant, ~4x the voice bill)
  # stream: true                      # false: fetch whole clips, hedging slow ones (below)
  # first_audio_timeout_seconds: 1.0  # no audio by then: send another request alongside it
  # retries: 2                        # extra requests per line
  # stream_prebuffer_seconds: 0.3     # audio in hand before a streamed line starts (smooths bursts)
  # turn_gap_seconds: 0.4             # pause when the other commentator takes over (0: back to back)
  # line_gap_seconds: 0.15            # pause when the same commentator carries on
  # hedge_after_seconds: 2.5          # stream: false only; send a second request if the first hasn't answered
  # prepare_deadline_seconds: 12      # lines voiced ahead (setup branches, wraps, closer) give up after
  # live_deadline_seconds: 5          # a line voiced on demand must be ready within this
  # flight_audio_deadline_seconds: 4  # a mid-flight call must start within this of impact

source:
  type: connector_log     # GSPconnect's debug log; falls back to gspro_log if it isn't there
  connector_log: 'C:\GSProV1\Core\GSPC\ConnectDebug.txt'
  gspro_log_truth: true   # tail GSPro's own log for strokes, penalties, holed shots, round ends
  # type: gspro_log       # any launch monitor: shots from GSPro's own log (ball data, no club data)
  # type: gspro_sniffer   # third-party Open Connect connectors instead (needs Npcap); or: replay
  # port: 921
  gspro_courses_dirs:                  # course libraries for par, stroke index and yardages
    - 'C:\GSProV1\Courses'
    - 'C:\GSProV1\Core\GSP\Courses'
  # iface: '\Device\NPF_Loopback'   # only if auto-detect picks the wrong adapter
  replay_file: data/sample_shots.jsonl
  replay_speed: 1.0

squabbit:
  enabled: false          # pull live handicaps at round start (needs SQUABBIT_EMAIL/PASSWORD in .env
                          # and "squabbit_invite" in the league file)
  timeout_seconds: 15     # if Squabbit is slow or offline, the league file's handicaps stand

booking:
  enabled: false          # read the sim's SuperSaaS bookings (needs SUPERSAAS_API_KEY in .env): a
                          # round in a "Practice" booking is practice; "League Week N" or no booking
                          # leaves the schedule matching to decide
  account: ""             # SuperSaaS account name, e.g. GolfShed
  schedule_id:            # the schedule's ID (end of its Configure page URL), e.g. 792418
  type_field: field_1_r   # the booking field with the League/Practice dropdown
  slack_minutes: 30       # a round this long before or after a booking still counts as in it
                          # (read at startup and as each setup screen comes up)

screen:
  monitor: 1
  capture: monitor           # framebuffer grab (never stalls GSPro). "window" is occlusion-proof
  window_title: GSPro        # but forces a synchronous render each grab and can freeze the game
  ocr_threads: 6             # cap OCR cores so it can't starve GSPro (null = all cores)
  follow_poll_seconds: 0.3   # how often the HUD is read while following a shot
  # follow_max_seconds: 12   # give up following a shot after this (a lost or wet ball never stops)
  # follow_roll_seconds: 8   # but once it lands, keep following at least this long for it to stop
  send_images: true       # screenshots for the vision call (the pre-shot hazard look)
  ocr: true               # check the screen read with `screen-check` first
  # Boxes around the GSPro HUD, as fractions of the screen. The built-in defaults fit the 3.1.x
  # release HUD (player box, hole box, both tile panels, minimap lie and slope, club box) and
  # adjust themselves to the screen's shape (16:10, 16:9, ...), so only list a region here to move
  # it; anything not listed keeps its default. `screen-check` shows which boxes read, and
  # `screen-check --fix` writes the ones that need moving here. A region you list is used exactly
  # as written, measured on your screen.
  # regions:
  #   lie: {left: 0.84, top: 0.45, width: 0.16, height: 0.53}

commentary:
  enabled: true           # false (or `run --no-commentary`): record shots and rounds only, no talking
  interest_threshold: 0.5
  routine_comment_rate: 0.3
  min_seconds_between_comments: 4
  recent_lines: 30   # shown to the model; a season-wide check catches older repeats
  max_words_per_line: 28
  aside_max_words: 30   # news, trivia and score asides: room to tell the story in one line
  segments_on_hole_change: true
  max_speech_backlog: 4
  in_flight: true
  flight_deadline_seconds: 3.0   # drop a mid-flight line that can't start by then
  min_flight_carry: 50           # no mid-flight call on chips and putts
  preshot: true
  preshot_rate: 0.6              # share of shots that get a setup line
  preshot_settle_seconds: 1.5
  # Carry prediction: penalties per lie are learned from your shots (keep GSPro's CARRY (raw)
  # and CARRY (game) tiles visible). Override a lie's starting penalty, or seed a course's
  # altitude before it has shots, if you need to:
  # lie_carry_factors: {pine straw: 0.97}
  # course_altitude_ft: {"Example Links": 5200}
  big_moment_threshold: 0.9      # shots this interesting get a three- or four-line exchange
  # Rounds. The opener plays when everyone is on shot 1 at even par and nothing has been
  # recorded on the course today (front or back nine). The wrap-up plays when GSPro's
  # scorecard shows every hole, or after round_end_idle_seconds of quiet on the last green.
  # The setup screen's HOLES tab (or GSPro's default of 18 when it isn't opened) sets the round's
  # holes; round_holes is the guess only when the booth didn't see the setup screen. With
  # source.gspro_log_truth on, GSPro's log corrects it (a longer round plays on, and GSPro's hole
  # layout sets the real count at the end).
  opener: true
  closer: true
  round_holes: 9
  # round_format: best ball      # overrides the league file's schedule for tonight
  round_end_idle_seconds: 60

# Real weather outside, from Open-Meteo (free, no key). The booth gets it in the opener and the
# closer, and now and then between holes ("pouring outside, dry in the shed").
weather:
  enabled: false
  # location: "03290"         # a town or postal code ("Nottingham, NH" works too), looked up at startup
  # country: US               # where the location is (a postal code alone is ambiguous)
  # place: Nottingham         # how the booth names it; defaults to the looked-up town
  # latitude: 43.1145         # or pin the spot exactly instead of `location`
  # longitude: -71.0998
  # refresh_minutes: 30
  # between_holes_rate: 0.2

# Real golf headlines as between-shots asides (ESPN's feed, no key), written at round start.
news:
  enabled: false
  # per_nine: 2
  # banter_rate: 0.35         # chance, on an ordinary shot, of an aside (news, scores or trivia)
  # max_age_days: 3           # older stories are left out; newer ones are told as of when they ran

# Live scores as between-shots asides, from ESPN's public scoreboards (no key): a tour leaderboard
# and your local teams (live, just finished, or later tonight). The holes that get one are picked at
# round start, but the scores are fetched, written (closer's model) and voiced as that hole starts,
# so they're minutes old on air. They share the news asides' spacing (one every three holes at most).
scores:
  enabled: false
  # tours: [pga]                                  # pga, lpga, eur, champions-tour
  # teams: [Bruins, Celtics, Red Sox, Patriots]   # names or ESPN abbreviations, found in NHL/NBA/MLB/NFL
  # teams: {nhl: [BOS], mls: [Revolution]}        # or per league (also wnba, mls)
  # per_nine: 1
  # max_age_minutes: 10       # a check-in that hasn't aired by then is dropped as stale

# Course trivia from the real course's Wikipedia article, written (closer's model) and voiced at round
# start. A story about one hole waits for that hole. Courses with no confident match get none.
trivia:
  enabled: false
  # per_round: 2
  # pages:                    # GSPro names the search can't place -> Wikipedia article titles
  #   The Ancient Course: Old Course at St Andrews
  #   Sheep Ranch: Bandon Dunes Golf Resort

# Where the pre-shot hazard read comes from. llm: the `preshot` vision model above reads a
# screenshot. jev: TypeSafe's Jev reads just the minimap in about a third of a second and also
# reads the carry over water and the front/back of the green, so the setup line can use them.
# Needs `pip install -e ".[jev]"` and TYPESAFE_API_KEY; falls back to `preshot` if Jev fails.
minimap:
  provider: llm
  # threshold: 0.7       # how sure Jev must be before a hazard becomes a fact
  # sand_threshold: 0.85 # how sure Jev must be that a sand-coloured patch is a bunker
  # tree_threshold: 0.85 # ... that a leafy patch near the line is a tree
  # choice_confidence: 0.8 # ... of the pin's side of the green, or a dogleg

putt_read:
  enabled: false       # read the putt's break from the drift of GSPro's green-grid dots (grid on; screen.capture: monitor)
  # gentle_px: 1.5     # sideways drift (px/frame at 4K) below which the break isn't called
  # slope_px: 0.7      # drift toward/away from the golfer needed to call it uphill/downhill

overlay:
  enabled: true        # the clickable ON AIR / OFF AIR badge over GSPro (toggles commentary live)
  left: 0.595          # top-left corner, as fractions of the primary screen
  top: 0.008
  scale: 1.0

# Put the stats page online for the league, behind a password, after every round
# (docs/tracking.md#sharing-the-stats-page). Needs `pip install -e ".[publish]"` and the upload
# keys in .env.
publish:
  enabled: false
  # bucket: shotcast-stats-bucket-xxxx   # the stack's BucketName output
  # region: us-east-1
  # delay_seconds: 180                   # it publishes once the sign-off has aired; this is the backup

# The Live tab on the published page: OBS's stream, mirrored to the publish bucket while a round is
# on (docs/tracking.md#live-stream). OBS's WebSocket password goes in .env (OBS_WEBSOCKET_PASSWORD).
live:
  enabled: false
  # with_rounds: true          # start OBS's output with each round, stop it after the sign-off
  # stop_after_seconds: 30
  # launch_obs: true           # start OBS minimized when the booth starts, if it isn't running
