[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gspro-shotcast"
version = "0.1.0"
description = "Shot tracking, stats and an AI broadcast booth for GSPro simulator golf"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10",
    "sounddevice>=0.4",   # speaker playback, whichever voice provider
    # Part-of-speech tagging, so the booth hears which descriptive words it keeps reusing (wordwatch.py).
    # The English model isn't on PyPI: it's pinned to spaCy's release wheel.
    "spacy>=3.8,<3.9",
    # preshed 3.0.14 breaks loading the model's tokenizer under spaCy 3.8 (OverflowError).
    "preshed<3.0.14",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# Live capture on the GSPro PC: screenshots, OCR and the Open Connect sniffer.
capture = ["mss>=9", "rapidocr>=3", "onnxruntime>=1.17", "scapy>=2.5"]
# Claude calls (the default pre-shot look, opener and closer) and the Google voices. The GPT calls
# and the OpenAI voices need no extra package.
cloud = ["anthropic", "google-cloud-texttospeech>=2.27"]
# Optional: the fast minimap hazard read by TypeSafe's Jev (minimap.provider: jev).
jev = ["typesafe-sdk>=0.7"]
# Optional: voices on the PC's own CPU (Kokoro) instead of the OpenAI voices.
local = ["kokoro-onnx>=0.4"]
# Uploading the stats page to S3 (`publish`).
publish = ["boto3"]
# The live stream on the stats page: starting and stopping OBS over its WebSocket server.
live = ["websocket-client>=1.7"]
# Importing the league's yearly spreadsheets.
league = ["openpyxl>=3.1"]
# The Windows app's tray icon (`shotcast tray`).
tray = ["pystray>=0.19"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3"]

[project.scripts]
shotcast = "commentator.__main__:main"

[tool.setuptools.packages.find]
include = ["commentator*"]

[tool.setuptools.package-data]
commentator = ["*.html", "*.ps1", "stats_vendor/*/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto"   # in parallel, one worker per core; -n0 runs serially (quicker for one test)
