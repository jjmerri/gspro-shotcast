function renderPlayers() {
  const d = state.data;
  const cols = [
    { key: "name", label: "Player" },
    { key: "rounds", label: "Rounds", title: "Finished rounds, or a full nine from one quit early" },
    { key: "index", label: "Index", title: "Handicap index worked out from rounds on record (World Handicap System rules, GSPro's tee ratings)" },
    { key: "avg_to_par_9", label: "Avg / 9", title: "Average score to par per nine holes (individual-ball rounds)" },
    { key: "best_to_par_9", label: "Best / 9" },
    { key: "sg_total", label: "SG / 9", title: "Strokes gained per nine vs. the PGA Tour baseline", val: p => p.sg ? p.sg.per_nine.total : null },
    { key: "fir_pct", label: "Fairways", title: "Fairways hit off the tee (par 4s and 5s)" },
    { key: "gir_pct", label: "GIR", title: "Greens in regulation" },
    { key: "scramble_pct", label: "Scrambling", title: "Par or better after missing the green" },
    { key: "sand_pct", label: "Sand saves", title: "Up and down from a greenside bunker (PGA Tour definition)" },
    { key: "putts_per_hole", label: "Putts / hole" },
    { key: "birdie_pct", label: "Birdie %", title: "Holes made in birdie or better" },
    { key: "avg_drive", label: "Avg drive" },
    { key: "longest_drive", label: "Longest" },
  ];
  const row = p => `<tr class="click${p.name === state.player ? " sel" : ""}" data-player="${esc(p.name)}"><td><b>${esc(p.name)}</b></td><td>${p.rounds}</td><td>${hcp(p.index)}</td>
    <td>${toPar(p.avg_to_par_9)}</td><td>${toPar(p.best_to_par_9)}</td>
    <td class="${p.sg && p.sg.per_nine.total >= 0 ? "good" : ""}">${p.sg ? signed(p.sg.per_nine.total, 1) : "–"}</td>
    <td>${dash(p.fir_pct, "%")} <span class="sub">${frac(p.fir)}</span></td>
    <td>${dash(p.gir_pct, "%")} <span class="sub">${frac(p.gir)}</span></td>
    <td>${dash(p.scramble_pct, "%")} <span class="sub">${frac(p.scramble)}</span></td>
    <td>${dash(p.sand_pct, "%")} <span class="sub">${frac(p.sand)}</span></td>
    <td>${dash(p.putts_per_hole)}</td><td>${dash(p.birdie_pct, "%")}</td>
    <td>${dash(p.avg_drive, " yd")}</td><td>${dash(p.longest_drive, " yd")}</td></tr>`;
  if (state.me && !d.players.some(p => p.name === state.me))
    return `<h2>${meTitle("Players")}</h2><p class="empty">${esc(state.me)} has no rounds in this view.</p>`;
  const shown = state.me ? d.players.filter(p => p.name === state.me) : d.players;
  let html = `<h2>${meTitle("Players")}</h2>` + sortable("players", shown, cols, row, { key: "avg_to_par_9" });
  const p = shown.find(p => p.name === (state.me || state.player))
    || [...shown].sort((a, b) => b.rounds - a.rounds || b.holes - a.holes)[0];
  if (p) { state.player = p.name; html += renderPlayer(p); }
  return html;
}

function renderPlayer(p) {
  const pa = p.par_avg;
  return `<h2>${esc(p.name)}</h2>
  <div class="cards">
    <div class="card"><div class="k">Scoring / 9</div><div class="v">${toPar(p.avg_to_par_9)}</div><div class="sub">best ${toPar(p.best_to_par_9)} · ${p.rounds} round${p.rounds === 1 ? "" : "s"} · ${p.holes} holes</div></div>
    <div class="card"><div class="k">Handicap index</div><div class="v">${hcp(p.index)}</div><div class="sub">${p.index === null || p.index === undefined ? `needs 3 rounds of 9+ holes (${(p.index_history || []).length} so far)` : `from ${p.index_history.length} round${p.index_history.length === 1 ? "" : "s"} on record`}</div></div>
    <div class="card"><div class="k">By par</div><div class="v" style="font-size:16px">P3 ${toPar(pa["3"])} · P4 ${toPar(pa["4"])} · P5 ${toPar(pa["5"])}</div><div class="sub">average to par per hole</div></div>
    <div class="card"><div class="k">Hole outcomes</div><div class="v" style="font-size:16px">${dash(p.birdie_pct, "%")} / ${dash(p.par_pct, "%")} / ${dash(p.bogey_pct, "%")} / ${dash(p.double_pct, "%")}</div><div class="sub">birdie+ / par / bogey / double+</div></div>
    <div class="card"><div class="k">Driving</div><div class="v">${dash(p.avg_drive, " yd")}</div><div class="sub">longest ${dash(p.longest_drive, " yd")} · ${p.drives} drives · ${dash(p.fir_pct, "%")} fairways</div></div>
  </div>
  <div class="grid2">
    <div><h2>Strokes gained</h2>${sgBars(p.sg)}</div>
    <div><h2>Night by night</h2><div class="charts" style="grid-template-columns:1fr 1fr">
      ${lineChart(p.trend, "to_par_9", "Score to par / 9", toPar, true)}
      ${lineChart(p.trend, "sg_9", "Strokes gained / 9", v => signed(v, 1))}
      ${lineChart(p.trend, "putts_per_hole", "Putts / hole", v => v.toFixed(2), true)}
      ${lineChart(p.trend, "gir_pct", "Greens in regulation", v => v + "%")}
      ${(p.index_history || []).some(h => h.index !== null) ? lineChart(p.index_history, "index", "Handicap index", hcp, true) : ""}
    </div></div>
  </div>
  <h2>Gapping and typical miss</h2>
  <div class="grid2">
    <div>${gapChart(p.gapping)}<p class="sub">Launch-monitor carry: the bar is the middle half of swings, the mark the median.</p></div>
    <div>${sortable("gap", p.gapping, [
      { key: "club", label: "Club" }, { key: "n", label: "Swings", title: "Full swings used (of all swings with the club)" }, { key: "carry", label: "Carry" },
      { key: "gap_to_next", label: "Gap", title: "Median carry gap to the next club down" },
      { key: "smash", label: "Smash", title: "Ball speed / club speed" }, { key: "launch", label: "Launch" },
      { key: "spin", label: "Spin" }, { key: "miss", label: "Typical flight", cls: "l" }],
      c => `<tr><td>${esc(c.club)}</td><td>${c.n}${c.swings > c.n ? ` <span class="sub">/ ${c.swings}</span>` : ""}</td><td>${dash(c.carry === null ? null : Math.round(c.carry), " yd")}</td>
        <td>${dash(c.gap_to_next, " yd")}</td><td>${dash(c.smash)}</td><td>${dash(c.launch, "°")}</td>
        <td>${dash(c.spin === null ? null : Math.round(c.spin))}</td><td class="l">${esc(c.miss || "–")}</td></tr>`,
      { key: "carry", dir: -1 })}
      <p class="sub">Medians over full swings (ball speed within 80% of the club's best, so chips and knock-downs are left out; a mulligan's swing counts). Flight is for a right-hander: start line and curve from the spin axis.</p></div>
  </div>
  <div class="grid2">
    <div><h2>Approach by club</h2>
      ${sortable("clubs", p.clubs, [
        { key: "club", label: "Club" }, { key: "n", label: "Shots" }, { key: "avg_from", label: "Avg from" },
        { key: "avg_finish", label: "Avg left", title: "Average distance from the pin after the shot" },
        { key: "best_finish", label: "Closest" }],
        c => `<tr><td>${esc(c.club)}</td><td>${c.n}</td><td>${dash(c.avg_from, " yd")}</td><td>${dash(c.avg_finish, " yd")}</td><td>${dash(c.best_finish, " yd")}</td></tr>`)}
      <p class="sub">Full shots from 250 yd or closer with a recorded finish (driver and putter left out).</p></div>
    <div><h2>Putting</h2>
      ${sortable("putts", p.putting.map((b, i) => ({ ...b, order: i })), [
        { key: "order", label: "Length" }, { key: "attempts", label: "Made", val: b => b.attempts || null },
        { key: "pct", label: "%" }, { key: "bar", label: "", cls: "l", val: b => b.pct }],
        b => `<tr><td>${b.range}</td><td>${b.attempts ? `${b.made}/${b.attempts}` : "–"}</td><td>${dash(b.pct, "%")}</td>
        <td class="l"><div class="bar"><i style="width:${Math.min(100, b.pct || 0)}%"></i></div></td></tr>`, { key: "order" })}
      <p class="sub">Putts with a known result. Gimmes (inside GSPro's ${state.data.gimme_ft ? `${state.data.gimme_ft} ft ` : ""}circle${state.data.gimme_ft ? ", the one most rounds use" : ""}) are conceded, not putted, so they're left out.</p></div>
  </div>
  <h2>Recovery</h2>
  ${sortable("rec", p.recovery, [
    { key: "lie", label: "From", cls: "l" }, { key: "band", label: "Distance", cls: "l" }, { key: "n", label: "Shots" },
    { key: "avg_from", label: "Avg from" }, { key: "green_pct", label: "Found the green" },
    { key: "avg_left", label: "Avg left", title: "Where the shot finished, when it was recorded" }],
    r => `<tr><td class="l">${esc(r.lie)}</td><td class="l">${r.band === "greenside" ? "greenside (≤50 yd)" : "longer"}</td><td>${r.n}</td>
      <td>${r.avg_from} yd</td><td>${dash(r.green_pct, "%")}${r.holed ? ` <span class="sub">${r.holed} holed</span>` : ""}</td><td>${dash(r.avg_left, " yd")}</td></tr>`)}
  <h2>Rounds</h2>
  ${sortable("hist", p.history, [
    { key: "date", label: "Date" }, { key: "course", label: "Course", cls: "l" }, { key: "played", label: "Holes" },
    { key: "gross", label: "Gross" }, { key: "to_par", label: "To par" }],
    h => `<tr><td>${esc(h.date)}</td><td class="l">${esc(h.course)}</td><td>${h.played}</td><td>${h.gross}</td><td>${toPar(h.to_par)}</td></tr>`,
    { key: "date", dir: -1 })}`;
}

function renderVersus() {
  const ps = state.data.players;
  if (ps.length < 2) return '<p class="empty">Head-to-head needs two players in the database.</p>';
  let [a, b] = state.versus;
  const ranked = [...ps].sort((x, y) => y.rounds - x.rounds || y.holes - x.holes);
  if (!ps.some(p => p.name === a)) a = ranked[0].name;
  if (!ps.some(p => p.name === b) || b === a) b = ranked.find(p => p.name !== a).name;
  state.versus = [a, b];
  const A = ps.find(p => p.name === a), B = ps.find(p => p.name === b);
  const opt = (sel, which) => `<select data-versus="${which}">${ps.map(p => `<option${p.name === sel ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select>`;
  const sg = (p, k) => p.sg ? p.sg.per_nine[k] : null;
  const rows = [
    ["Rounds", p => p.rounds, null, v => v],
    ["Handicap index", p => p.index, -1, hcp],
    ["Scoring / 9", p => p.avg_to_par_9, -1, toPar],
    ["Best nine", p => p.best_to_par_9, -1, toPar],
    ["Strokes gained / 9", p => sg(p, "total"), 1, v => signed(v)],
    ["  off the tee", p => sg(p, "off_tee"), 1, v => signed(v)],
    ["  approach", p => sg(p, "approach"), 1, v => signed(v)],
    ["  around the green", p => sg(p, "around_green"), 1, v => signed(v)],
    ["  putting", p => sg(p, "putting"), 1, v => signed(v)],
    ["Fairways", p => p.fir_pct, 1, v => v + "%"],
    ["Greens in regulation", p => p.gir_pct, 1, v => v + "%"],
    ["Scrambling", p => p.scramble_pct, 1, v => v + "%"],
    ["Sand saves", p => p.sand_pct, 1, v => v + "%"],
    ["Putts / hole", p => p.putts_per_hole, -1, v => v],
    ["Birdie or better", p => p.birdie_pct, 1, v => v + "%"],
    ["Double bogey or worse", p => p.double_pct, -1, v => v + "%"],
    ["Average drive", p => p.avg_drive, 1, v => v + " yd"],
    ["Longest drive", p => p.longest_drive, 1, v => v + " yd"],
  ];
  const cell = (v, other, better, fmt) => {
    const win = better && v !== null && v !== undefined && other !== null && other !== undefined && (better > 0 ? v > other : v < other);
    return `<td class="${win ? "win" : ""}">${v === null || v === undefined ? "–" : fmt(v)}</td>`;
  };
  const tally = [0, 0];
  rows.forEach(([, f, better]) => {
    const x = f(A), y = f(B);
    if (!better || x === null || y === null || x === undefined || y === undefined || x === y) return;
    tally[(better > 0 ? x > y : x < y) ? 0 : 1]++;
  });
  const courseA = {}, courseB = {};
  A.history.forEach(h => (courseA[h.course] = courseA[h.course] || []).push(h.to_par * 9 / h.played));
  B.history.forEach(h => (courseB[h.course] = courseB[h.course] || []).push(h.to_par * 9 / h.played));
  const avg = xs => xs.reduce((s, x) => s + x, 0) / xs.length;
  const shared = Object.keys(courseA).filter(c => courseB[c]);
  return `<h2>Head-to-head</h2><div class="controls">${opt(a, 0)} <span class="sub">vs</span> ${opt(b, 1)}
      <span class="sub" style="margin-left:12px">Categories won: <b class="good">${tally[0]}</b> – <b class="good">${tally[1]}</b></span></div>
    <table class="versus"><thead><tr><th>Stat</th><th>${esc(a)}</th><th>${esc(b)}</th></tr></thead><tbody>
    ${rows.map(([label, f, better, fmt]) => `<tr><td${label.startsWith("  ") ? ' class="sub" style="padding-left:24px"' : ""}>${label.trim()}</td>${cell(f(A), f(B), better, fmt)}${cell(f(B), f(A), better, fmt)}</tr>`).join("")}
    </tbody></table>
    <h2>Courses both have played</h2>
    ${shared.length ? `<table><thead><tr><th>Course</th><th>${esc(a)} / 9</th><th>${esc(b)} / 9</th></tr></thead><tbody>
      ${shared.map(c => { const x = avg(courseA[c]), y = avg(courseB[c]);
        return `<tr><td>${esc(c)}</td><td class="${x < y ? "good" : ""}">${toPar(x)} <span class="sub">(${courseA[c].length})</span></td><td class="${y < x ? "good" : ""}">${toPar(y)} <span class="sub">(${courseB[c].length})</span></td></tr>`; }).join("")}
      </tbody></table>` : '<p class="empty">No course in common yet.</p>'}`;
}

function replayPart(reps, round) {
  if (!reps || !Object.keys(reps).length) return "";
  const rp = reps[state.replayHole];
  if (!rp) return '<p class="sub">Click a hole number for a replay of the hole.</p>';
  // One colour per player for the whole round, in the order they first appear in it.
  const names = [...new Set(Object.keys(reps).sort((x, y) => x - y).flatMap(h => reps[h].players.map(p => p.name)))];
  const colors = Object.fromEntries(names.map((n, i) => [n, REPLAY_COLORS[i % REPLAY_COLORS.length]]));
  // The player to single out: the one picked at the top, else this round row's player.
  const focus = [state.me, round.side].find(n => n && rp.players.some(p => p.name === n)) || null;
  // Animate once per opening, not again on every re-render (a sort, another round's toggle).
  const key = `${state.round}:${state.replayHole}`, animate = state.replayPlayed !== key;
  state.replayPlayed = key;
  const actions = ` · <span class="acts">${watchBtn(rp.ts, "▶ Watch the hole")}${shareBtn(hashFor("rounds", { round: state.round, hole: state.replayHole }), `hole ${rp.hole}`)}</span>`;
  return replaySvg(rp, animate, { colors, focus, only: state.replayOnly && focus ? focus : null, actions });
}

const SCORE_NAMES = { "-3": "albatross", "-2": "eagle", "-1": "birdie", "0": "par", "1": "bogey", "2": "double bogey", "3": "triple bogey" };
const scoreName = (score, par) => score === 1 ? "hole-in-one" : SCORE_NAMES[score - par] || `+${score - par}`;
function shotText(s) {
  const from = s.putt ? `${Math.round(s.to_pin * 3)} ft putt` : `${esc(s.club || "?")} from ${Math.round(s.to_pin)} yd${s.lie ? ` (${esc(s.lie)})` : ""}`;
  const to = s.outcome === "holed" ? ", holed" : s.putt ? (s.outcome ? `, ${esc(s.outcome)}` : "")
    : s.finish !== null && s.finish !== undefined ? `, to ${s.finish < 10 ? Math.round(s.finish * 3) + " ft" : Math.round(s.finish) + " yd"}` : "";
  return `Hole ${s.hole}: ${from}${to} <span class="${s.sg >= 0 ? "good" : "bad"}">${signed(s.sg)}</span>`;
}

// A player's round against their season: the numbers, strokes gained, best and worst shots and holes.
function roundSummary(r) {
  const m = r.summary;
  if (!m) return "";
  const fmt = { to_par: toPar, pct: v => v + "%", num: v => v.toFixed(2) };
  const vs = m.vs.map(v => {
    const cls = v.season === null ? "" : (v.round - v.season) * v.better > 0 ? "good" : (v.round - v.season) * v.better < 0 ? "bad" : "";
    return `<div class="card"><div class="k">${v.label}</div><div class="v ${cls}">${fmt[v.fmt](v.round)}</div><div class="sub">season ${v.season === null ? "–" : fmt[v.fmt](v.season)}</div></div>`;
  }).join("");
  const sg = m.sg ? `<p class="sub">Strokes gained this round: ${Object.entries(SG_LABELS).map(([k, label]) =>
    `${label.toLowerCase()} <b class="${m.sg[k] >= 0 ? "good" : "bad"}">${signed(m.sg[k], 1)}</b>`).join(" · ")}</p>` : "";
  const moments = [
    m.best_shot && `<div><span class="sub">Best shot</span><br>${shotText(m.best_shot)}${shotActions(m.best_shot)}</div>`,
    m.worst_shot && `<div><span class="sub">Costliest shot</span><br>${shotText(m.worst_shot)}${shotActions(m.worst_shot)}</div>`,
    m.best_hole && `<div><span class="sub">Best hole</span><br>Hole ${m.best_hole.hole}: ${scoreName(m.best_hole.score, m.best_hole.par)} ${m.best_hole.score} on the par ${m.best_hole.par}</div>`,
    m.worst_hole && `<div><span class="sub">Worst hole</span><br>Hole ${m.worst_hole.hole}: ${scoreName(m.worst_hole.score, m.worst_hole.par)} ${m.worst_hole.score} on the par ${m.worst_hole.par}</div>`,
  ].filter(Boolean).join("");
  return `<h3 class="rsum">Round summary</h3><div class="cards">${vs}</div>${sg}${moments ? `<div class="moments">${moments}</div>` : ""}`;
}

// A round as an image to post: course, player, score, the card, and the round's numbers.
function shareCard(r) {
  const holes = r.card || [], nines = [holes.slice(0, 9), holes.slice(9, 18)].filter(n => n.length);
  const W = 1080, cell = 84, left = 140, top = 360, rowH = 54, block = rowH * 3 + 30;
  const H = top + nines.length * block + 300;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  const font = (size, weight = 400) => (g.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`);
  const text = (t, x, y, color = "#e6efe9", align = "left") => { g.fillStyle = color; g.textAlign = align; g.fillText(t, x, y); };
  g.fillStyle = "#0f1715"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#5fc58a"; g.fillRect(0, 0, W, 10);
  font(28, 600); text("⛳ GSPro Shotcast", 60, 70, "#8fa59b");
  font(30); text(r.date || "", W - 60, 70, "#8fa59b", "right");
  font(58, 700); text(r.course || "", 60, 150);
  font(38, 500); text(r.side + (r.format && r.format !== "individual" ? ` · ${r.format.replace("_", " ")}` : ""), 60, 205, "#8fa59b");
  font(120, 700); text(String(r.gross ?? "–"), 60, 330);
  const grossW = g.measureText(String(r.gross ?? "–")).width;
  font(64, 600); text(r.to_par === null || r.to_par === undefined ? "" : toPar(r.to_par), 60 + grossW + 30, 330,
                      r.to_par < 0 ? "#5fc58a" : r.to_par > 0 ? "#e57373" : "#e6efe9");
  font(30); text(`${r.played}${r.played !== r.holes ? ` of ${r.holes}` : ""} holes`, W - 60, 330, "#8fa59b", "right");
  nines.forEach((nine, n) => {
    const y0 = top + n * block + 20;
    font(26, 600);
    text("Hole", 60, y0 + rowH * 0.7, "#8fa59b"); text("Par", 60, y0 + rowH * 1.7, "#8fa59b"); text("Score", 60, y0 + rowH * 2.7, "#8fa59b");
    nine.forEach((h, i) => {
      const x = left + i * cell + cell / 2, d = h.score - h.par;
      font(26, 600); text(String(h.hole), x, y0 + rowH * 0.7, "#5fc58a", "center");
      font(28); text(String(h.par), x, y0 + rowH * 1.7, "#8fa59b", "center");
      const cy = y0 + rowH * 2.5;
      g.lineWidth = 3; g.strokeStyle = d < 0 ? "#e57373" : "#6fb3ff";
      if (d < 0) { for (let k = 0; k < (d <= -2 ? 2 : 1); k++) { g.beginPath(); g.arc(x, cy, 26 - k * 7, 0, Math.PI * 2); g.stroke(); } }
      else if (d > 0) { for (let k = 0; k < (d >= 2 ? 2 : 1); k++) g.strokeRect(x - 25 + k * 7, cy - 25 + k * 7, 50 - k * 14, 50 - k * 14); }
      font(32, 600); text(String(h.score), x, y0 + rowH * 2.7, "#e6efe9", "center");
    });
    const tot = nine.reduce((a, h) => a + h.score, 0), par = nine.reduce((a, h) => a + h.par, 0);
    font(26, 600); text(n ? "In" : nines.length > 1 ? "Out" : "Tot", left + 9 * cell + 40, y0 + rowH * 0.7, "#8fa59b", "center");
    font(28); text(String(par), left + 9 * cell + 40, y0 + rowH * 1.7, "#8fa59b", "center");
    font(32, 700); text(String(tot), left + 9 * cell + 40, y0 + rowH * 2.7, "#e6efe9", "center");
  });
  let y = top + nines.length * block + 60;
  const pct = p => p && p[1] ? `${p[0]}/${p[1]}` : null;
  const stats = [["Fairways", pct(r.fir)], ["Greens", pct(r.gir)], ["Putts", r.putts],
                 ["Longest drive", r.longest_drive ? Math.round(r.longest_drive) + " yd" : null]].filter(s => s[1] !== null && s[1] !== undefined);
  stats.forEach(([k, v], i) => {
    const x = 60 + i * (W - 120) / stats.length;
    font(24, 600); text(k.toUpperCase(), x, y, "#8fa59b");
    font(44, 700); text(String(v), x, y + 52);
  });
  y += 120;
  const m = r.summary, plain = h => h.replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  if (m && m.best_shot) { font(30); text("Best shot  " + plain(shotText(m.best_shot)), 60, y, "#e6efe9"); y += 50; }
  if (m && m.sg) { font(26); text(`Strokes gained vs. tour: ${signed(m.sg.total, 1)}`, 60, y, "#8fa59b"); }
  return c;
}

async function shareRound(r, btn) {
  const canvas = shareCard(r);
  const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
  const name = `${r.date}-${r.course}-${r.side}`.replace(/[^\w-]+/g, "-") + ".png";
  const file = new File([blob], name, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: `${r.side} at ${r.course}` }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  btn.textContent = "Saved the image";
  setTimeout(() => (btn.textContent = "Share card"), 2000);
}

function renderRounds() {
  const d = state.data;
  const cols = [
    { key: "date", label: "Date" }, { key: "course", label: "Course", cls: "l" }, { key: "side", label: "Player / side", cls: "l" },
    { key: "format", label: "Format", cls: "l" }, { key: "played", label: "Holes" }, { key: "gross", label: "Gross" },
    { key: "to_par", label: "To par" }, { key: "fir", label: "Fairways", val: r => r.fir[1] ? r.fir[0] / r.fir[1] : null },
    { key: "gir", label: "GIR", val: r => r.gir[1] ? r.gir[0] / r.gir[1] : null }, { key: "putts", label: "Putts" },
  ];
  const row = r => {
    const open = state.round === r.id;
    if (open && state.replays[r.round] === undefined) loadReplays(r.round);
    const reps = open && typeof state.replays[r.round] === "object" ? state.replays[r.round] : null;
    const tags = (!state.data.has_league ? "" : r.league ? '<span class="tag">league</span>' : '<span class="tag">practice</span>') + (r.complete ? "" : '<span class="tag">quit early</span>')
      + (r.gimme_ft != null && d.gimme_ft != null && r.gimme_ft !== d.gimme_ft ? `<span class="tag" title="This round's gimme circle differs from the usual ${d.gimme_ft} ft">${r.gimme_ft} ft gimmes</span>` : "")
      + (state.seen && r.ended > state.seen ? '<span class="tag new">new</span>' : "");
    return `<tr class="click" data-round="${r.id}"><td>${esc(r.date)}</td><td class="l">${esc(r.course)}</td>
      <td class="l">${esc(r.side)}${r.team && r.team !== r.side ? ` <span class="sub">${esc(r.team)}</span>` : ""}</td>
      <td class="l">${esc(r.format.replace("_", " "))}${tags}</td><td>${r.played}/${r.holes}</td><td>${dash(r.gross)}</td>
      <td>${toPar(r.to_par)}</td><td>${frac(r.fir)}</td><td>${frac(r.gir)}</td><td>${dash(r.putts)}</td></tr>` +
      (open ? `<tr class="detail"><td colspan="${cols.length}">${scorecard(r.card, reps)}${shotsUsed(r, reps)}${roundSummary(r)}${replayPart(reps, r)}
        <p class="sub">Scrambling ${frac(r.scramble)} · Sand saves ${frac(r.sand)} · Penalties ${dash(r.penalties)}${r.longest_drive ? ` · Longest drive ${Math.round(r.longest_drive)} yd` : ""}</p>
        <p><button class="link" data-roundshots="${r.round}">Every shot of this round →</button>
          · <button class="link" data-sharecard="${r.id}" title="An image of this round to post or send">Share card</button>
          · ${shareBtn(hashFor("rounds", { round: r.id }), "this round", "Share link")}${(w => w ? " · " + w : "")(watchBtn(r.started, "▶ Watch the round"))}</p></td></tr>` : "");
  };
  const rows = state.me ? d.rounds.filter(r => r.players.includes(state.me)) : d.rounds;
  return `<h2>${meTitle("Rounds")}</h2>` + sortable("rounds", rows, cols, row, { empty: "No rounds in this view." })
    + `<p class="sub">Click a round for its scorecard and its shots.${state.me ? " Includes team rounds they played in." : ""}</p>`;
}

function renderCourses() {
  if (!state.me) return coursesView(state.data.courses, null);
  return withMine(meTitle("Courses"), m => coursesView(m.courses, state.data.courses));
}

// field: everyone's courses, to compare the picked player's holes against.
function coursesView(cs, field) {
  if (!cs.length) return `<h2>${meTitle("Courses")}</h2><p class="empty">No courses yet.</p>`;
  const c = cs.find(c => c.course === state.course) || cs[0];
  state.course = c.course;
  const list = sortable("courses", cs, [
    { key: "course", label: "Course" }, { key: "rounds", label: "Player rounds" },
    { key: "players", label: "Players", cls: "l", val: c => c.players.length },
    { key: "best", label: "Best nine", val: c => c.best ? c.best.to_par_9 : null },
    { key: "last_played", label: "Last played" }],
    x => `<tr class="click${x.course === c.course ? " sel" : ""}" data-course="${esc(x.course)}"><td><b>${esc(x.course)}</b></td><td>${x.rounds}</td>
      <td class="l">${esc(x.players.join(", "))}</td><td>${x.best ? `${toPar(x.best.to_par_9)} <span class="sub">${esc(x.best.player)}</span>` : "–"}</td><td>${esc(x.last_played)}</td></tr>`);
  const fc = field && field.find(x => x.course === c.course);
  const fieldHole = n => { const h = fc && fc.holes.find(h => h.hole === n); return h ? h.to_par : null; };
  const maxAbs = Math.max(0.5, ...c.holes.map(h => Math.abs(h.to_par)));
  const holes = sortable("courseholes", c.holes, [
    { key: "hole", label: "Hole" }, { key: "par", label: "Par" }, { key: "n", label: "Played" },
    { key: "avg", label: "Average" }, { key: "to_par", label: "To par" }, { key: "bar", label: "", val: h => h.to_par },
    ...(field ? [{ key: "field", label: "Everyone", title: "Everyone's average to par on this hole", val: h => fieldHole(h.hole) },
                 { key: "vs", label: "vs everyone", title: "Below zero: they play it better than the field", val: h => fieldHole(h.hole) === null ? null : h.to_par - fieldHole(h.hole) }] : []),
    { key: "birdie_pct", label: "Birdie+" }, { key: "bogey_plus_pct", label: "Bogey+" }, { key: "best", label: "Best" }, { key: "worst", label: "Worst" }],
    h => {
      const w = Math.abs(h.to_par) / maxAbs * 50;
      const style = h.to_par >= 0 ? `left:50%;width:${w}%;background:var(--bad)` : `left:${50 - w}%;width:${w}%;background:var(--accent)`;
      const tag = h.hole === c.hardest ? '<span class="tag">hardest</span>' : h.hole === c.easiest ? '<span class="tag">easiest</span>' : "";
      return `<tr><td>${h.hole}${tag}</td><td>${h.par}</td><td>${h.n}</td><td>${h.avg.toFixed(2)}</td><td>${signed(h.to_par)}</td>
        <td style="width:160px"><div class="sgbar"><span class="mid"></span><i style="${style}"></i></div></td>
        ${field ? (f => `<td>${f === null ? "–" : signed(f)}</td><td class="${f !== null && h.to_par < f ? "good" : ""}">${f === null ? "–" : signed(h.to_par - f)}</td>`)(fieldHole(h.hole)) : ""}
        <td>${h.birdie_pct}%</td><td>${h.bogey_plus_pct}%</td><td>${h.best}</td><td>${h.worst}</td></tr>`;
    }, { key: "hole" });
  return `<h2>${meTitle("Courses")}</h2>${list}<h2>${esc(c.course)}: hole by hole</h2>${holes}
    <p class="sub">${field ? `${esc(state.me)}'s individual-ball cards on this course, against everyone's.` : "Every individual-ball card on this course."} ${c.best ? `Best nine: ${esc(c.best.player)}, ${toPar(c.best.to_par)} over ${c.best.holes} holes on ${esc(c.best.date)}.` : ""}</p>`;
}

async function loadShots() {
  state.shots = "loading";
  render();
  if (state.shotLink) {   // a link to one shot: list the round it's in (or its day)
    const id = state.shotLink;
    state.shotLink = null;
    try {
      const [s] = await query("SELECT round, date FROM pub_shot WHERE id = ?", [id]);
      if (s) state.shotFilter = s.round ? { round: String(s.round) } : { from: s.date, to: s.date };
    } catch (e) {}
  }
  const f = state.shotFilter;
  try { state.shots = await queryShots(state.ctx, state.me ? { ...f, player: state.me } : f); } catch (e) { state.shots = { error: e.message }; }
  render();
}

function renderShots() {
  const d = state.data, f = state.shotFilter;
  const sel = (key, label, values) => `<select data-shotf="${key}"><option value="">${label}: all</option>${values.map(v =>
    `<option${f[key] === v ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
  const dates = d.filters.dates, lo = dates[dates.length - 1] || "", hi = dates[0] || "";
  const day = (key, label) => `<label class="sub">${label} <input type="date" data-shotf="${key}" value="${esc(f[key] || "")}" min="${lo}" max="${hi}"></label>`;
  const chip = f.round ? `<span class="chip">Round: ${esc(roundLabel(+f.round))} <button data-unround title="Show all rounds">✕</button></span>` : "";
  const any = Object.keys(f).length ? '<button class="link" data-clearshots>Clear filters</button>' : "";
  const who = `<select data-me><option value="">Player: all</option>${d.players.map(p => `<option${p.name === state.me ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select>`;
  const controls = `<div class="controls">${chip}${who}
    ${sel("course", "Course", d.filters.courses)}${sel("club", "Club", d.filters.clubs)}${sel("lie", "Lie", d.filters.lies)}
    ${day("from", "From")}${day("to", "to")}${any}</div>`;
  if (state.shots === null) { loadShots(); return `<h2>${meTitle("Shots")}</h2>${controls}<p class="sub">Loading…</p>`; }
  if (state.shots === "loading") return `<h2>${meTitle("Shots")}</h2>${controls}<p class="sub">Loading…</p>`;
  if (state.shots.error) return `<h2>${meTitle("Shots")}</h2>${controls}<div class="err">${esc(state.shots.error)}</div>`;
  const yd = v => v === null || v === undefined ? "–" : v + " yd";
  const ft = v => v === null || v === undefined ? "–" : Math.round(v * 3) + " ft";
  const row = s => {
    const putt = s.is_putt, open = state.shotOpen === s.id;
    const result = s.outcome ? s.outcome : s.lie_after ? `to the ${s.lie_after}` : "";
    const left = putt ? "" : s.finish !== null ? ` · ${s.lie_after === "green" ? ft(s.finish) : yd(s.finish)} left` : "";
    const head = `<tr class="click${open ? " sel" : ""}" data-shot="${s.id}"><td>${esc(s.date)}</td><td class="l">${esc(s.player)}</td>
      <td class="l">${esc(s.course)} <span class="sub">${esc(holeName(s.hole))}</span></td><td>${dash(s.shot_number)}</td><td>${esc(s.club || (s.outcome === "gimme" ? "gimme" : "–"))}</td>
      <td class="l">${esc(s.lie_before || "–")}</td><td>${putt ? ft(s.to_pin) : yd(s.to_pin)}</td>
      <td>${putt || !s.carry ? "–" : s.carry + " yd"}</td><td class="l">${esc(s.shape || "")}</td><td class="l">${esc(result)}${left}${s.mulligan ? '<span class="tag">mulligan</span>' : ""}${s.left_out ? '<span class="tag" title="Left out of the stats by hand">left out</span>' : ""}</td>
      <td>${s.lines.length ? `💬 ${s.lines.length}` : ""}</td></tr>`;
    if (!open) return head;
    const launch = putt ? "" : `<p class="sub">Ball ${dash(s.ball_speed && s.ball_speed.toFixed(1), " mph")} · club ${dash(s.club_speed && s.club_speed.toFixed(1), " mph")} ·
      launch ${dash(s.launch_angle && s.launch_angle.toFixed(1), "°")} · spin ${dash(s.total_spin && Math.round(s.total_spin), " rpm")} ·
      axis ${dash(s.spin_axis && s.spin_axis.toFixed(1), "°")} · start ${dash(s.start_direction && s.start_direction.toFixed(1), "°")} · total ${yd(s.total)}</p>`;
    const said = s.lines.length ? s.lines.map(l => `<div class="line"><div class="who ${COLOR_KEYS.has(l.speaker) ? "color" : ""}">${esc(nameOf(l.speaker))}</div><div>${esc(l.text)} <span class="tag">${esc(l.kind)}</span></div></div>`).join("")
      : '<p class="empty">The booth said nothing tied to this shot.</p>';
    const leave = state.local && !s.mulligan ? `<p><button class="link" data-leaveout="${s.id}" data-on="${s.left_out ? 0 : 1}">${s.left_out ? "Count this shot in the stats again" : "Leave this shot out of the stats"}</button>
      <span class="sub">A bad read or a practice swing: it stays on the card and in the replay, but out of every average, record and strokes gained.</span></p>` : "";
    const acts = `<p><span class="acts">${watchBtn(s.ts, "▶ Watch the shot")}${shareBtn(hashFor("shots", { shot: s.id, player: "" }), "this shot", "Share link")}</span></p>`;
    return head + `<tr class="detail"><td colspan="11">${launch}${said}${acts}${leave}</td></tr>`;
  };
  const table = sortable("shots", state.shots.map((s, i) => ({ ...s, order: i })), [
    { key: "order", label: "Night", title: "Newest first" }, { key: "player", label: "Player", cls: "l" },
    { key: "course", label: "Course / hole", cls: "l", val: s => `${s.course} ${s.hole}` }, { key: "shot_number", label: "#" },
    { key: "club", label: "Club" }, { key: "lie_before", label: "From", cls: "l" },
    { key: "to_pin", label: "To pin" },
    { key: "carry", label: "Carry", val: s => s.is_putt ? null : s.carry },
    { key: "shape", label: "Shape", cls: "l", title: "A right-hander's shot shape, from the start direction and spin axis" }, { key: "result", label: "Result", cls: "l", val: s => s.outcome || s.lie_after },
    { key: "said", label: "💬", val: s => s.lines.length }],
    row, { key: "order", dir: f.round ? -1 : 1, empty: "No shots match." });
  return `<h2>${meTitle("Shots")}</h2>${controls}${table}
    <p class="sub">${f.round ? "In the order they were played" : "Newest first, up to 500"}. Click a column to sort; click a shot for its launch numbers and what the booth said.</p>`;
}

function roundLabel(id) {
  const sides = state.data.rounds.filter(r => r.round === id);
  if (!sides.length) return "not in this view";
  return `${sides[0].date} · ${sides[0].course} · ${[...new Set(sides.map(r => r.side))].join(", ")}`;
}

function nameOf(key) {
  const p = state.data.booth.commentators.find(c => c.key === key);
  return p ? p.name : key;
}

async function loadTranscript(id) {
  state.session = id;
  state.transcript = "loading";
  render();
  try { state.transcript = await queryTranscript(id); } catch (e) { state.transcript = { error: e.message }; }
  render();
}

function renderBroadcasts() {
  const bs = state.me ? state.data.broadcasts.filter(b => b.players.includes(state.me)) : state.data.broadcasts;
  if (!bs.length) return `<h2>${meTitle("Broadcasts")}</h2><p class="empty">No broadcasts recorded yet.</p>`;
  if (state.session === null || !bs.some(b => b.id === state.session)) { state.session = bs[0].id; loadTranscript(bs[0].id); }
  const label = b => `${b.date} · ${b.courses.join(", ") || "no course"} · ${b.players.join(", ")} (${b.lines} lines)`;
  const pick = `<div class="controls"><select data-session>${bs.map(b => `<option value="${b.id}"${b.id === state.session ? " selected" : ""}>${esc(label(b))}</option>`).join("")}</select></div>`;
  const t = state.transcript;
  if (!t || t === "loading") return `<h2>${meTitle("Broadcasts")}</h2>${pick}<p class="sub">Loading…</p>`;
  if (t.error) return `<h2>${meTitle("Broadcasts")}</h2>${pick}<div class="err">${esc(t.error)}</div>`;
  let lastCtx = null;
  const body = t.map(l => {
    const ctx = l.player ? `${l.player} · ${holeName(l.hole)}${l.shot_number ? ` · stroke ${l.shot_number}` : ""}${l.club ? ` · ${l.club}` : ""}` : (l.kind === "opener" ? "Opening" : l.kind === "closer" ? "Sign-off" : null);
    const head = ctx && ctx !== lastCtx ? `<div class="shotctx">${esc(ctx)}</div>` : "";
    if (ctx) lastCtx = ctx;
    const kind = !l.player && !["opener", "closer"].includes(l.kind) ? ` <span class="tag">${esc(KIND_LABEL[l.kind] || l.kind)}</span>` : "";
    return head + `<div class="line"><div class="who ${COLOR_KEYS.has(l.speaker) ? "color" : ""}">${esc(l.name)}</div><div>${esc(l.text)}${kind}</div></div>`;
  }).join("");
  return `<h2>${meTitle("Broadcasts")}</h2>${pick}<div>${body || '<p class="empty">Nothing said in this session.</p>'}</div>`;
}

function renderHighlights() {
  const p = state.period;
  if (!state.me) return highlightsView(state.data.records[p], state.data.highlights[p]);
  return withMine(meTitle("Records"), m => highlightsView(m.records[p], m.highlights[p]));
}

function highlightsView(r, h) {
  const ft = y => Math.round(y * 3);
  const where = x => [x.course, holeName(x.hole)].filter(Boolean).join(" · ");
  const card = (k, x, v) => `<div class="card"><div class="k">${k}</div>${x ? `<div class="v">${v(x)}</div><div class="sub">${esc(x.player)} · ${esc(where(x))}${shotActions(x)}</div>` : '<div class="empty">None yet</div>'}</div>`;
  const top = (title, rows, fmt) => `<div><h3>${title}</h3><table><tbody>${rows.length ? rows.map((x, i) =>
    `<tr><td class="wrap">${i + 1}. <b>${esc(x.player)}</b><br><span class="sub">${esc(x.date)} · ${esc(where(x))}</span>${shotActions(x)}</td><td>${fmt(x)}</td></tr>`).join("")
    : '<tr><td class="empty">None yet</td></tr>'}</tbody></table></div>`;
  const pick = `<div class="controls"><div class="seg">${PERIODS.map(([k, label]) =>
    `<button data-period="${k}" class="${k === state.period ? "on" : ""}">${label}</button>`).join("")}</div></div>`;
  return `<h2>${meTitle("Records")}</h2>${pick}<div class="cards">
    ${card("Longest drive", r.longest_drive, x => Math.round(x.v) + " yd")}
    ${card("Closest approach", r.closest_approach, x => `${x.outcome === "holed" ? "holed" : ft(x.v) + " ft"} <span class="sub">${esc(x.club || "")}${x.from_yd != null ? ` from ${x.from_yd} yd` : ""}</span>`)}
    ${card("Longest putt holed", r.longest_putt, x => ft(x.v) + " ft")}
  </div>
  <h2>Moments</h2>
  ${h.moments.length ? h.moments.map(m => `<div class="moment"><div class="kind">${esc(m.kind)}</div><div><b>${esc(m.player)}</b> · ${esc(m.text)}
    <div class="sub">${esc(m.date)} · ${esc(m.course)}${m.hole ? ` · hole ${m.hole}` : ""}${shotActions(m)}</div></div></div>`).join("")
    : '<p class="empty">No aces, eagles or hole-outs yet.</p>'}
  <div class="grid2">
    ${top("Longest drives", h.drives, x => x.v + " yd")}
    ${top("Closest approaches", h.approaches, x => `${x.outcome === "holed" ? "holed" : x.v + " ft"} <span class="sub">${esc(x.club || "")} from ${x.from_yd} yd</span>`)}
    ${top("Closest chips", h.chips, x => `${x.outcome === "holed" ? "holed" : x.v + " ft"} <span class="sub">${esc(x.club || "")} from ${x.from_yd} yd, ${esc(x.lie || "off the green")}</span>`)}
    ${top("Longest putts holed", h.putts, x => x.v + " ft")}
    <div><h3>Birdie streaks</h3><table><tbody>${h.streaks.length ? h.streaks.map(s =>
      `<tr><td><b>${esc(s.player)}</b> <span class="sub">${esc(s.date)} · ${esc(s.course)} · holes ${s.holes[0]}–${s.holes[s.holes.length - 1]}</span>${shotActions(s)}</td><td>${s.length} in a row</td></tr>`).join("")
      : '<tr><td class="empty">No back-to-back birdies yet.</td></tr>'}</tbody></table></div>
    <div><h3><span class="hint" title="A birdie or better on the hole straight after a bogey or worse">Bounce-backs</span></h3><table><tbody>${h.bounce_backs.length ? h.bounce_backs.map(b =>
      `<tr><td><b>${esc(b.player)}</b> <span class="sub">${esc(b.date)} · ${esc(b.course)} · holes ${b.holes[0]}–${b.holes[1]}</span>${shotActions(b)}</td><td>${esc(b.from)} → ${esc(b.to)}</td></tr>`).join("")
      : '<tr><td class="empty">No birdie straight after a bogey yet.</td></tr>'}</tbody></table></div>
    <div><h3>Blow-ups</h3><table><tbody>${h.blowups.length ? h.blowups.map(b =>
      `<tr><td><b>${esc(b.player)}</b> <span class="sub">${esc(b.date)} · ${esc(b.course)} · hole ${b.hole} (par ${b.par})</span>${shotActions(b)}</td><td>${b.score} <span class="sub">+${b.over}</span></td></tr>`).join("")
      : '<tr><td class="empty">Nothing worse than a double yet.</td></tr>'}</tbody></table></div>
  </div>`;
}

function renderBooth() {
  const b = state.data.booth, preds = state.data.predictions;
  const kinds = [...new Set(b.commentators.flatMap(c => Object.keys(c.kinds)))].sort();
  const KIND = KIND_LABEL;
  const nights = {};
  b.calls.forEach(c => { (nights[c.who] = nights[c.who] || []); });
  const cum = {};
  Object.keys(nights).forEach(who => {
    let calls = 0, right = 0;
    nights[who] = b.calls.filter(c => c.who === who).map(c => { calls += c.calls; right += c.right; return { date: c.date, pct: Math.round(100 * right / calls) }; });
  });
  return `<h2>The booth</h2><div class="cards">${b.commentators.map(c => {
    const p = preds.find(p => p.commentator === c.name);
    return `<div class="card"><div class="k">${esc(c.name)}</div><div class="v">${c.lines} lines</div>
      <div class="sub">${c.words.toLocaleString()} words · ${c.words_per_line} per line${p ? ` · putt calls ${p.right}/${p.calls} (${p.pct}%)` : ""}</div>
      ${c.phrases.length ? `<div class="sub" style="margin-top:8px">Favourite phrases: ${c.phrases.slice(0, 6).map(x => `“${esc(x)}”`).join(", ")}</div>` : ""}</div>`;
  }).join("")}</div>
  <h2>Lines by kind</h2>
  ${sortable("kinds", kinds.map(k => Object.assign({ kind: KIND[k] || k }, ...b.commentators.map(c => ({ ["c_" + c.key]: c.kinds[k] || 0 })))),
    [{ key: "kind", label: "Kind" }, ...b.commentators.map(c => ({ key: "c_" + c.key, label: esc(c.name) }))],
    r => `<tr><td>${esc(r.kind)}</td>${b.commentators.map(c => `<td>${r["c_" + c.key]}</td>`).join("")}</tr>`,
    { key: b.commentators.length ? "c_" + b.commentators[0].key : "kind", dir: -1 })}
  <h2>Putt calls over the season</h2>
  ${sortable("pred", preds, [{ key: "commentator", label: "Commentator" }, { key: "calls", label: "Calls" }, { key: "right", label: "Right" }, { key: "pct", label: "%" }],
    p => `<tr><td>${esc(p.commentator)} <span class="sub">${esc(p.role)}</span></td><td>${p.calls}</td><td>${p.right}</td><td>${dash(p.pct, "%")}</td></tr>`)}
  <div class="charts" style="margin-top:12px">${Object.entries(nights).map(([who, pts]) => lineChart(pts, "pct", `${esc(who)}: running call accuracy`, v => v + "%")).join("")}</div>
  <h2>Nights on air</h2>
  ${sortable("nights", b.nights, [{ key: "date", label: "Night" }, { key: "rounds", label: "Rounds" }, { key: "lines", label: "Lines" },
    { key: "per", label: "Lines / round", val: n => n.rounds ? n.lines / n.rounds : null }],
    n => `<tr><td>${esc(n.date)}</td><td>${n.rounds}</td><td>${n.lines}</td><td>${n.rounds ? Math.round(n.lines / n.rounds) : "–"}</td></tr>`, { key: "date", dir: -1 })}`;
}

// The live stream (live_stream.py): live/status.json says whether OBS is on air and which
// session's playlist to play. A site without the stream has no status.json, and no Live tab.
const HLS_LIB = "vendor/hls.js-1.7.3/hls.light.min.js";
let player = null;   // { session, video, hls }: kept across renders so playback doesn't restart
// While live, the booth rewrites status.json's "at" every 30 seconds. One that stops changing (or is
// long past, allowing for clocks that disagree) is a booth killed mid-stream: off air.
const LIVE_QUIET_MS = 100000, LIVE_DEAD_S = 600;
let beat = { at: null, seen: 0 };
async function pollLive() {
  let s = null;
  try {
    const r = await fetch("live/status.json", { cache: "no-store" });
    if (r.ok) s = await r.json();
  } catch (e) { s = null; }
  if (s && s.live && s.at) {
    const now = Date.now();
    if (s.at !== beat.at) beat = { at: s.at, seen: now };
    if (now - beat.seen > LIVE_QUIET_MS || now / 1000 - s.at > LIVE_DEAD_S) s = { live: false };
  }
  if (s) delete s.at;
  const was = JSON.stringify(state.live);
  state.live = s;
  if (JSON.stringify(s) === was) return;
  const onTab = state.tab === "live";
  if (!s && onTab) state.tab = "players";   // a #live link to a site without the stream
  showTabs();
  if (onTab) render();
}

function renderLive() {
  const s = state.live;
  if (!s) return `<h2>Live</h2><p class="sub">There's no live stream on this page.</p>`;
  if (!s.live) return `<h2>Live</h2><p class="sub">Off air. The stream comes on when a round starts at the sim.</p>`;
  return `<h2>Live <span class="sub">since ${esc(new Date(s.since * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }))}</span></h2>
  <div id="liveslot"></div>
  <p class="sub">About 20 seconds behind the sim. It starts muted: unmute in the player.${
    (state.vods || []).some(v => v.session === s.session)
      ? ` Missed the start? <button class="link" data-vod="${esc(s.session)}" data-vodat="0">Watch from the beginning</button>.`
      : " Nothing is recorded."}</p>`;
}

function stopLive() {
  if (!player) return;
  if (player.hls) player.hls.destroy();
  player.video.removeAttribute("src");
  player.video.load();
  player = null;
}

let hlsLoading = null;   // one download, however many times the tab is opened while it runs
function loadHls() {
  if (!hlsLoading) hlsLoading = new Promise((ok, fail) => {
    const el = document.createElement("script");
    el.src = HLS_LIB; el.onload = ok;
    el.onerror = () => { el.remove(); hlsLoading = null; fail(new Error(`couldn't load ${HLS_LIB}`)); };
    document.head.appendChild(el);
  });
  return hlsLoading;
}

// What the player should be showing: the Live tab's stream, or the Round replays tab's pick.
function wantedVideo() {
  const s = state.live;
  if (state.tab === "live" && s && s.live) return { key: s.session, src: `live/s/${encodeURIComponent(s.session)}/stream.m3u8`, live: true };
  if (state.tab === "vods" && state.vod && (state.vods || []).some(v => v.session === state.vod.session))
    return { key: "vod:" + state.vod.session, src: `live/s/${encodeURIComponent(state.vod.session)}/full.m3u8`, at: state.vod.at || 0 };
  return null;
}

// After each render: put the player (the same element, so it keeps playing) in the tab's slot.
function attachLive() {
  const want = wantedVideo(), slot = $("#liveslot");
  if (!want || !slot) { stopLive(); return; }
  if (player && player.session !== want.key) stopLive();
  if (!player) {
    const video = Object.assign(document.createElement("video"), { controls: true, autoplay: true, muted: !!want.live, playsInline: true });
    const me = player = { session: want.key, video, hls: null };
    if (window.MediaSource || window.ManagedMediaSource) {
      loadHls().then(() => {
        if (player !== me) return;
        // A recording still going is a growing playlist: start where asked, not at its live edge.
        me.hls = new Hls(want.live ? { liveSyncDurationCount: 2 } : { startPosition: want.at });
        me.hls.loadSource(want.src);
        me.hls.attachMedia(video);
      }).catch(e => { if (player === me) slot.innerHTML = `<div class="err">The player didn't load: ${esc(e.message)}</div>`; });
    } else {
      video.src = want.src;   // iPhones play HLS themselves
      if (!want.live) video.addEventListener("loadedmetadata", () => { video.currentTime = want.at; }, { once: true });
    }
  }
  slot.appendChild(player.video);
}

// Round replays (live_stream.py keeps each stream for a week): live/recordings.json lists them, each with
// where its rounds start. The schedule (schedule.json) is the sim's bookings, uploaded by the booth.
const EXTRA_TABS = ["live", "vods", "schedule"];
async function pollExtras() {
  const get = async url => { try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const [rec, sched] = await Promise.all([get("live/recordings.json"), get("schedule.json")]);
  const vods = rec && Array.isArray(rec.recordings) ? rec.recordings.filter(v => v.duration > 0 || v.ended === null) : null;
  const schedule = sched && Array.isArray(sched.bookings) ? sched : null;
  const was = JSON.stringify([state.vods, state.schedule]);
  state.vods = vods; state.schedule = schedule;
  if (JSON.stringify([vods, schedule]) === was) return;
  const shown = state.tab;
  if ((state.tab === "vods" && !(vods && vods.length)) || (state.tab === "schedule" && !schedule)) state.tab = "players";
  showTabs();
  // The watch buttons on rounds, shots and records need the streams too.
  if ([...EXTRA_TABS, "rounds", "shots", "highlights"].includes(shown)) render();
}

const hm = secs => { const m = Math.round(secs / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m} min`; };
const when = (t, opts) => new Date(t).toLocaleString([], opts);

function renderVods() {
  const vods = state.vods || [];
  if (!vods.length) return `<h2>Round replays</h2><p class="sub">Nothing kept yet: each round streamed live is kept here for a week.</p>`;
  const sel = state.vod && vods.find(v => v.session === state.vod.session);
  const going = v => v.ended === null && state.live && state.live.live && state.live.session === v.session;
  const chapters = v => (v.rounds.length ? v.rounds : [{ at: 0, label: "From the start" }]).map(r =>
    `<button class="link" data-vod="${esc(v.session)}" data-vodat="${r.at}">${esc(r.label)}</button>`
    + (r.at ? ` <span class="sub">${hm(r.at)} in</span>` : "")).join("<br>");
  const day = { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
  return `<h2>Round replays <span class="sub">the stream of every round, kept for a week</span></h2>
  ${sel ? `<h3>${esc((sel.rounds[0] || {}).label || "Stream")} <span class="sub">${esc(when(sel.since * 1000, day))}</span></h3>
    <div id="liveslot"></div>
    ${sel.rounds.length > 1 ? `<div class="controls">Jump to: ${sel.rounds.map(r =>
      `<button class="link" data-vod="${esc(sel.session)}" data-vodat="${r.at}">${esc(r.label)}</button>`).join(" · ")}</div>` : ""}` : ""}
  <table><tr><th>Started</th><th class="l">Rounds</th><th>Length</th></tr>
  ${vods.map(v => `<tr class="${sel === v ? "sel" : ""}"><td>${esc(when(v.since * 1000, day))}</td><td class="l wrap">${chapters(v)}</td>
    <td>${going(v) ? '<span class="livedot"></span>live' : v.duration ? hm(v.duration) : "–"}</td></tr>`).join("")}
  </table>`;
}

function renderSchedule() {
  const sc = state.schedule;
  if (!sc) return `<h2>Schedule</h2><p class="sub">No schedule on this page.</p>`;
  const now = new Date(), days = {};
  for (const b of sc.bookings) (days[b.start.slice(0, 10)] ||= []).push(b);
  const t = s => new Date(s).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const body = Object.entries(days).map(([d, bs]) => `<tr><th class="l" colspan="3">${esc(new Date(d + "T12:00")
      .toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }))}</th></tr>`
    + bs.map(b => {
      const on = new Date(b.start) <= now && now < new Date(b.finish);
      return `<tr class="${on ? "sel" : ""}"><td>${esc(t(b.start))} – ${esc(t(b.finish))}${on ? ' <span class="tag">now</span>' : ""}</td>
        <td class="l">${esc(b.name || "Booked")}</td><td class="l sub">${esc(b.kind)}</td></tr>`;
    }).join("")).join("");
  return `<h2>Schedule <span class="sub">the sim's bookings · updated ${esc(when(sc.updated, { weekday: "short", hour: "numeric", minute: "2-digit" }))}</span></h2>
  ${body ? `<table>${body}</table>` : '<p class="sub">Nothing booked.</p>'}`;
}

const RENDER = { live: renderLive, vods: renderVods, schedule: renderSchedule, players: renderPlayers, versus: renderVersus, rounds: renderRounds, courses: renderCourses,
                 shots: renderShots, broadcasts: renderBroadcasts, highlights: renderHighlights, booth: renderBooth };
function render() {
  if (!state.data) return;
  $("#main").innerHTML = RENDER[state.tab]();
  attachLive();
  writeHash();
  // A link to a round, hole or shot: bring it into view once it's drawn (replays and shots load later).
  const go = state.scrollTo;
  if (go) {
    const el = Date.now() < go.until && document.querySelector(go.sel);
    if (el) requestAnimationFrame(() => el.scrollIntoView({ behavior: "smooth", block: "center" }));
    if (el || Date.now() >= go.until) state.scrollTo = null;
  }
}

// With the commentary off there is nothing on the booth's tabs: hide them. No stream, no Live tab.
function tabs() {
  const d = state.data;
  const has = { live: state.live !== null && state.live !== undefined, vods: !!(state.vods && state.vods.length),
                schedule: !!state.schedule };
  if (d) Object.assign(has, { broadcasts: d.broadcasts.length > 0,
                              booth: d.booth.commentators.length > 0 || d.booth.calls.length > 0 || d.predictions.length > 0 });
  return TABS.filter(([k]) => has[k] !== false);
}

function showTabs() {
  $("#tabs").innerHTML = tabs().map(([k, label]) => `<button data-tab="${k}" class="${k === state.tab ? "on" : ""}">`
    + `${k === "live" && state.live && state.live.live ? '<span class="livedot"></span>' : ""}${label}</button>`).join("");
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-ctx],[data-sort],[data-player],[data-round],[data-course],[data-shot],"
                             + "[data-roundshots],[data-unround],[data-clearshots],[data-share],[data-replay],[data-replayagain],[data-replayonly],[data-leaveout],[data-sharecard],[data-period],[data-vod],[data-link]");
  if (!t) return;
  if (t.dataset.link) {
    shareLink(t.dataset.link, t.dataset.linktitle, t);
    return;
  }
  if (t.dataset.vod) {
    // From another tab: a history entry to come back to (the back button reloads that view).
    if (state.tab !== "vods") history.pushState(null, "", location.hash);
    const at = +t.dataset.vodat || 0;
    if (player && player.session === "vod:" + t.dataset.vod) {
      player.video.currentTime = at;   // the same stream: just jump
      player.video.play().catch(() => {});
    } else {
      stopLive();
    }
    state.vod = { session: t.dataset.vod, at };
    state.tab = "vods";
    showTabs();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (t.dataset.period) {
    state.period = t.dataset.period;
    render();
    return;
  }
  if (t.dataset.sharecard) {
    const r = state.data.rounds.find(r => r.id === +t.dataset.sharecard);
    if (r) shareRound(r, t);
    return;
  }
  if (t.dataset.leaveout) {
    t.disabled = true;
    t.textContent = "Saving…";
    fetch(`api/shots/${t.dataset.leaveout}/left-out`, { method: "POST", headers: { "Content-Type": "application/json" },
                                                       body: JSON.stringify({ left_out: t.dataset.on === "1" }) })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); load(); })
      .catch(e => { t.textContent = `Couldn't save (${e.message})`; });
    return;
  }
  if (t.dataset.share !== undefined) {
    shareLink(hashFor(), "this view", t);
  } else if (t.dataset.replayonly !== undefined) {
    state.replayOnly = !state.replayOnly;
    render();
  } else if (t.dataset.replayagain !== undefined) {
    state.replayPlayed = null;
    render();
  } else if (t.dataset.replay) {
    state.replayPlayed = null;
    state.replayHole = state.replayHole === +t.dataset.replay ? null : +t.dataset.replay;
    render();
  } else if (t.dataset.roundshots) {   // drill into a round: just its shots
    state.shotFilter = { round: t.dataset.roundshots };
    delete state.sort.shots;
    state.tab = "shots";
    showTabs();
    loadShots();
  } else if (t.dataset.unround !== undefined || t.dataset.clearshots !== undefined) {
    if (t.dataset.unround !== undefined) delete state.shotFilter.round; else state.shotFilter = {};
    delete state.sort.shots;
    loadShots();
  } else if (t.dataset.tab) {
    state.tab = t.dataset.tab;
    showTabs();
    render();
  } else if (t.dataset.ctx !== undefined) {
    state.ctx = t.dataset.ctx;
    document.querySelectorAll("#ctx button").forEach(b => b.classList.toggle("on", b === t));
    load();
  } else if (t.dataset.sort) {
    const [id, key] = t.dataset.sort.split(":");
    const s = state.sort[id] || shownSort[id];
    state.sort[id] = { key, dir: s && s.key === key ? -s.dir : 1 };
    render();
  } else if (t.dataset.player) {
    state.player = t.dataset.player;
    render();
  } else if (t.dataset.round) {
    state.round = state.round === +t.dataset.round ? null : +t.dataset.round;
    state.replayHole = state.replayPlayed = null;
    render();
  } else if (t.dataset.course) {
    state.course = t.dataset.course;
    render();
  } else if (t.dataset.shot) {
    state.shotOpen = state.shotOpen === +t.dataset.shot ? null : +t.dataset.shot;
    render();
  }
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.me !== undefined) {
    setMe(t.value);
  } else if (t.dataset.versus !== undefined) {
    state.versus[+t.dataset.versus] = t.value;
    render();
  } else if (t.dataset.shotf) {
    if (t.value) state.shotFilter[t.dataset.shotf] = t.value; else delete state.shotFilter[t.dataset.shotf];
    loadShots();
  } else if (t.dataset.session !== undefined) {
    loadTranscript(+t.value);
  }
});

// A link pasted into an open page: start over from it.
window.addEventListener("hashchange", () => location.reload());

showTabs();
load();
pollLive();
setInterval(pollLive, 15000);
pollExtras();
setInterval(pollExtras, 60000);
</script>
</body>
</html>
