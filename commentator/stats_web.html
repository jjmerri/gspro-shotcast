<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season stats</title>
<style>
  :root { --bg:#0f1715; --panel:#16211e; --line:#24332f; --text:#e6efe9; --dim:#8fa59b; --accent:#5fc58a;
          --bad:#e07a6b; --birdie:#d9534f; --eagle:#f0ad4e; --bogey:#3a7bd5; --double:#24539c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; padding:12px 22px;
           border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:2; }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  header .meta { color:var(--dim); font-size:12px; margin-left:auto; }
  nav button, .seg button { background:none; border:1px solid var(--line); color:var(--dim); padding:6px 11px;
           border-radius:6px; cursor:pointer; font:inherit; }
  nav button.on, .seg button.on { color:var(--text); border-color:var(--accent); background:#1d2c27; }
  nav, .seg { display:flex; flex-wrap:wrap; gap:6px; }
  main { padding:16px 22px 60px; max-width:1300px; margin:0 auto; }
  h2 { font-size:15px; margin:26px 0 10px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; }
  h3 { font-size:14px; margin:18px 0 8px; }
  table { border-collapse:collapse; width:100%; background:var(--panel); border-radius:8px; overflow:hidden; }
  th, td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:600; font-size:12px; user-select:none; }
  th[data-sort] { cursor:pointer; }
  th[data-sort]:hover { color:var(--text); }
  th:first-child, td:first-child { text-align:left; }
  td.l, th.l { text-align:left; }
  td.wrap { white-space:normal; }
  tr.click { cursor:pointer; }
  tr.click:hover td, tr.sel td { background:#1c2a26; }
  tr.sel td:first-child { box-shadow:inset 3px 0 var(--accent); }
  .sub { color:var(--dim); font-size:12px; }
  .good { color:var(--accent); } .bad { color:var(--bad); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .card .v { font-size:22px; font-weight:600; margin-top:2px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(380px, 1fr)); gap:18px; }
  /* A long course name wraps under the player instead of pushing the panel into its neighbour. */
  .grid2 > div { min-width:0; }
  .grid2 td:first-child { white-space:normal; text-align:left; }
  .hint { cursor:help; text-decoration:underline dotted; text-underline-offset:3px; }
  .scorecard td, .scorecard th, .detail .scorecard td { text-align:center; padding:5px 6px; min-width:30px; }
  .scorecard td:first-child, .scorecard th:first-child, .detail .scorecard td:first-child { text-align:left; }
  .s { display:inline-block; text-align:center; min-width:24px; padding:1px 4px; border-radius:4px; }
  .s.eagle { background:var(--eagle); color:#111; border-radius:50%; }
  .s.birdie { border:2px solid var(--birdie); border-radius:50%; }
  .s.bogey { border:2px solid var(--bogey); }
  .s.double { background:var(--double); }
  .tag { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); color:var(--dim); margin-left:6px; }
  .detail td { background:#121b19; padding:12px 14px; text-align:left; white-space:normal; }
  h3.rsum { font-size:13px; margin:16px 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; }
  .detail .cards { grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; }
  .detail .card { padding:8px 10px; }
  .moments { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:8px 16px; margin:8px 0; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; min-width:80px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .err { color:#ff8a80; padding:20px; }
  .livedot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--birdie); margin-right:6px; vertical-align:1px; }
  #liveslot video { width:100%; max-height:78vh; background:#000; border-radius:8px; }
  .empty { color:var(--dim); padding:10px 0; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:8px 0 14px; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  input[type=date] { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 6px; font:inherit; color-scheme:dark; }
  button.link { background:none; border:none; color:var(--accent); cursor:pointer; font:inherit; padding:0; }
  .scorecard button.link.on { text-decoration:underline; font-weight:700; }
  .replay { margin:10px 0; } .replay svg { background:#16241f; border:1px solid var(--line); border-radius:8px; max-width:100%; height:auto; }
  /* The replay's animation: each element runs once and then holds the static drawing's look. */
  .rp-in { animation:rp-in .3s ease-out both; }
  .rp-draw { stroke-dasharray:var(--len); animation:rp-draw .55s ease-in-out both; }
  .rp-ball { animation:rp-fly .55s ease-in-out both; }
  @keyframes rp-in { from { opacity:0; } }
  @keyframes rp-draw { from { stroke-dashoffset:var(--len); } to { stroke-dashoffset:0; } }
  /* The ball moves along its flight by its own animateMotion; this only shows it while it flies. */
  @keyframes rp-fly { 0% { opacity:0; } 1% { opacity:1; } 99% { opacity:1; } 100% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .rp-in, .rp-draw, .rp-ball { animation:none; } .rp-ball { display:none; } }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--accent); border-radius:999px; padding:4px 6px 4px 12px; background:#1d2c27; }
  .chip button { background:none; border:none; color:var(--dim); cursor:pointer; font:inherit; padding:0 4px; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:12px; }
  .chart { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .chart svg { width:100%; height:auto; max-height:170px; display:block; }
  .sg { display:grid; grid-template-columns:120px 1fr 60px; gap:6px 10px; align-items:center; }
  .sgbar { position:relative; height:12px; background:var(--line); border-radius:3px; }
  .sgbar i { position:absolute; top:0; bottom:0; border-radius:3px; }
  .sgbar .mid { position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--dim); }
  .line { padding:6px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:110px 1fr; gap:10px; }
  .line .who { color:var(--accent); font-weight:600; }
  .line .who.color { color:var(--eagle); }
  .shotctx { margin:14px 0 4px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .gap { display:grid; grid-template-columns:44px 1fr; gap:4px 10px; align-items:center; }
  .gaptrack { position:relative; height:16px; }
  .gaptrack .rng { position:absolute; top:4px; height:8px; background:#2c4a3f; border-radius:4px; }
  .gaptrack .med { position:absolute; top:0; width:3px; height:16px; background:var(--accent); border-radius:2px; }
  .gaptrack .lbl { position:absolute; top:-1px; font-size:11px; color:var(--dim); }
  .moment { display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .moment .kind { min-width:90px; color:var(--eagle); font-weight:600; text-transform:capitalize; }
  .versus td.win { color:var(--accent); font-weight:600; }
  #me { border-color:var(--accent); }
  .tag.new { border-color:var(--eagle); color:var(--eagle); }
  .meta button.link { font-size:12px; margin-left:10px; }
  .acts { white-space:nowrap; } .acts button.link + button.link { margin-left:8px; }
  @media (max-width: 800px) {
    header { position:static; padding:10px 12px; gap:8px 10px; }
    header .meta { margin-left:0; width:100%; }
    main { padding:10px 12px 40px; }
    table { display:block; overflow-x:auto; }
    .grid2 { grid-template-columns:1fr; }
    .line { grid-template-columns:80px 1fr; }
    .sg { grid-template-columns:90px 1fr 50px; }
  }
</style>
</head>
<body>
<header>
  <h1>⛳ Season stats</h1>
  <nav id="tabs"></nav>
  <div class="seg" id="ctx">
    <button data-ctx="" class="on">All</button>
    <button data-ctx="league">League</button>
    <button data-ctx="practice">Practice</button>
  </div>
  <select id="me" data-me title="Show one player's rounds, shots and stats (remembered on this device)"></select>
  <div class="meta" id="meta"></div>
</header>
<main id="main"></main>
<script src="vendor/sql.js-httpvfs-0.8.12/index.js"></script>
<script>
const TABS = [["live", "Live"], ["vods", "Round replays"], ["schedule", "Schedule"], ["players", "Players"], ["versus", "Head-to-head"], ["rounds", "Rounds"], ["courses", "Courses"],
              ["shots", "Shots"], ["highlights", "Highlights"], ["broadcasts", "Broadcasts"], ["booth", "Booth"]];
const PERIODS = [["3m", "3 months"], ["6m", "6 months"], ["9m", "9 months"], ["1y", "1 year"], ["all", "All time"]];
// A link holds the view: #tab?player=…&ctx=… and the tab's own keys (hashFor): a shots filter and an
// open shot, an open round and hole, a course, a head-to-head pair, a player, a video and a time in it.
const [hashTab, hashQuery] = location.hash.slice(1).split("?");
const linkQ = new URLSearchParams(hashQuery || "");
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
const SHOT_LINK_KEYS = ["round", "from", "to", "course", "club", "lie"];
const state = { tab: TABS.some(t => t[0] === hashTab) ? hashTab : "players", ctx: "", data: null, player: null,
                me: linkQ.get("player") ?? store.get("shotcast.me") ?? "", mine: null,
                seen: Number(store.get("shotcast.seen")) || 0,
                round: null, sort: {}, course: null, versus: [null, null], shotFilter: {}, shots: null, shotOpen: null,
                session: null, transcript: null, replays: {}, replayHole: null, replayOnly: false,
                vods: undefined, vod: linkQ.get("vod") ? { session: linkQ.get("vod"), at: +linkQ.get("at") || 0 } : null,
                schedule: undefined,
                period: PERIODS.some(p => p[0] === linkQ.get("period")) ? linkQ.get("period") : "1y" };
if (["league", "practice"].includes(linkQ.get("ctx"))) state.ctx = linkQ.get("ctx");
const linkNum = k => Number(linkQ.get(k)) || null;
if (hashTab === "shots") {
  for (const k of SHOT_LINK_KEYS) if (linkQ.get(k)) state.shotFilter[k] = linkQ.get(k);
  if (linkNum("shot")) {
    state.shotOpen = linkNum("shot");
    state.scrollTo = { sel: `tr[data-shot="${state.shotOpen}"]`, until: Date.now() + 20000 };
    // A shot on its own: the page looks up its round (loadShots) and lists that round's shots.
    if (!SHOT_LINK_KEYS.some(k => linkQ.get(k))) state.shotLink = state.shotOpen;
  }
}
if (hashTab === "rounds" && linkNum("round")) {
  state.round = linkNum("round");
  state.replayHole = linkNum("hole");
  state.scrollTo = { sel: state.replayHole ? ".replay" : `tr[data-round="${state.round}"]`, until: Date.now() + 20000 };
}
if (hashTab === "courses" && linkQ.get("course")) state.course = linkQ.get("course");
if (state.me) { state.player = state.me; state.versus[0] = state.me; }
if (hashTab === "players" && !state.me && linkQ.get("show")) state.player = linkQ.get("show");
if (hashTab === "versus") state.versus = [linkQ.get("a") || state.versus[0], linkQ.get("b") || state.versus[1]];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dash = (v, suffix = "") => v === null || v === undefined ? "–" : v + suffix;
const toPar = (v) => v === null || v === undefined ? "–" : v === 0 ? "E" : (v > 0 ? "+" : "") + (Math.round(v * 10) / 10);
const signed = (v, d = 2) => v === null || v === undefined ? "–" : (v > 0 ? "+" : "") + v.toFixed(d);
const frac = (pair) => pair && pair[1] ? `${pair[0]}/${pair[1]}` : "–";
const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const holeName = (label) => label ? label.replace(/, \d+ yards$/, "") : "";
const COLOR_KEYS = new Set(["color"]);
const KIND_LABEL = { banter: "News banter", closer: "Sign-off", flight: "Ball in flight", opener: "Opening", preshot: "Pre-shot",
                     reaction: "Reaction", segment: "Between shots", shot: "Shot call" };

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  const body = await r.json();
  if (body && body.error) throw new Error(body.error);
  return body;
}

// The site (stats_site.py): latest.json names the version; its summary-<context>.json holds the
// season stats, and its stats.db the shots and transcripts, read a few pages at a time.
const LIB = "vendor/sql.js-httpvfs-0.8.12/";
let site = null;   // { version, db }
async function query(sql, args) {
  const tried = site;
  try {
    return await runQuery(sql, args);
  } catch (e) {
    // Open across a couple of publishes: this version's stats.db is gone, so move to the newest
    // (once, even when several queries fail together).
    if (site === tried) {
      const latest = await getJSON("latest.json", { cache: "no-store" });
      if (latest.version === tried.version) throw e;
      if (site === tried) site = { version: latest.version, db: null };
    }
    return await runQuery(sql, args);
  }
}

async function runQuery(sql, args) {
  if (!site.db) {
    const abs = (u) => new URL(u, location.href).toString();
    site.db = createDbWorker([{ from: "inline", config: { serverMode: "full", url: abs(`v/${site.version}/stats.db`),
                                                          requestChunkSize: 1024 } }],
                             abs(LIB + "sqlite.worker.js"), abs(LIB + "sql-wasm.wasm"));
  }
  const w = await site.db;
  return w.db.query(sql, args);
}

// The same SQL as stats_site.shot_query: newest first, up to 500.
const SHOT_FILTERS = ["date", "player", "course", "club", "lie", "round"];
const SHOT_RANGE = { from: ">=", to: "<=" };
async function queryShots(ctx, f) {
  const where = [], args = [];
  if (ctx === "league" || ctx === "practice") { where.push("s.is_league = ?"); args.push(ctx === "league" ? 1 : 0); }
  for (const key of SHOT_FILTERS) if (f[key]) { where.push(`s.${key} = ?`); args.push(key === "round" ? Number(f[key]) : f[key]); }
  for (const [key, op] of Object.entries(SHOT_RANGE)) if (f[key]) { where.push(`s.date ${op} ?`); args.push(f[key]); }
  const sql = "SELECT j.json FROM pub_shot s JOIN pub_shot_json j ON j.ord = s.ord"
    + (where.length ? " WHERE " + where.join(" AND ") : "") + " ORDER BY s.ord LIMIT 500";
  return (await query(sql, args)).map(r => JSON.parse(r.json));
}

// A round's hole replays (hole_replay.py), by hole number. A site built before replays has no table.
async function loadReplays(round) {
  state.replays[round] = "loading";
  let got = {};
  try {
    for (const r of await query("SELECT hole, json FROM pub_replay WHERE round = ?", [Number(round)])) got[r.hole] = JSON.parse(r.json);
    const ids = [...new Set(Object.values(got).filter(rp => rp.map).map(rp => rp.map.id))];
    if (ids.length) {
      const src = {};
      for (const r of await query(`SELECT id, src FROM pub_hole_image WHERE id IN (${ids.map(() => "?").join(",")})`, ids)) src[r.id] = r.src;
      for (const rp of Object.values(got)) if (rp.map) { if (src[rp.map.id]) rp.map.src = src[rp.map.id]; else delete rp.map; }
    }
  } catch (e) { got = {}; }
  state.replays[round] = got;
  render();
}

async function queryTranscript(id) {
  const rows = await query("SELECT json FROM pub_transcript WHERE session_id = ?", [Number(id)]);
  return rows.length ? JSON.parse(rows[0].json) : [];
}

let loading = 0;   // only the latest load() may show its data (a slow older one can finish last)
async function load() {
  const mine = ++loading;
  $("#main").innerHTML = '<p class="sub">Loading…</p>';
  try {
    const latest = await getJSON("latest.json", { cache: "no-store" });
    if (mine !== loading) return;
    state.local = !!latest.local;   // served by the booth's own stats server, which can leave shots out
    if (!site || site.version !== latest.version) { site = { version: latest.version, db: null }; state.session = null; state.replays = {}; }
    const body = await getJSON(`v/${site.version}/summary-${state.ctx || "all"}.json`);
    if (mine !== loading) return;
    state.data = body;
    state.shots = null;
    // The tabs read from their own files may not have loaded yet: they settle it themselves.
    if (!tabs().some(([k]) => k === state.tab) && !EXTRA_TABS.includes(state.tab)) state.tab = "players";
    showTabs();
    document.querySelectorAll("#ctx button").forEach(b => b.classList.toggle("on", b.dataset.ctx === state.ctx));
    showMe();
    markSeen();
    $("#ctx").style.display = body.has_league ? "" : "none";
    const mod = new Date(body.db.modified * 1000).toLocaleString();
    const fresh = state.seen ? body.rounds.filter(r => r.ended > state.seen && (!state.me || r.players.includes(state.me))).length : 0;
    $("#meta").innerHTML = `${esc(body.db.name)} · updated ${esc(mod)} · last session ${esc(body.last_session || "–")}`
      + (fresh ? ` · <b class="good">${fresh} new round${fresh > 1 ? "s" : ""} since your last visit</b>` : "")
      + `<button class="link" data-share title="Share a link to exactly this view">Share link</button>`;
    render();
  } catch (e) {
    if (mine === loading) $("#main").innerHTML = `<div class="err">Couldn't read the database: ${esc(e.message)}</div>`;
  }
}

// The picked player ("me"): every tab narrows to them. Remembered on this device.
function showMe() {
  const names = state.data.players.map(p => p.name);
  if (state.me && !names.includes(state.me)) names.push(state.me);
  $("#me").innerHTML = `<option value="">Everyone</option>` + names.map(n => `<option${n === state.me ? " selected" : ""}>${esc(n)}</option>`).join("");
}

function setMe(name) {
  state.me = name;
  store.set("shotcast.me", name || null);
  delete state.shotFilter.player;
  state.shots = null;
  state.session = null;
  if (name) { state.player = name; state.versus[0] = name; if (state.versus[1] === name) state.versus[1] = null; }
  load();
}

// One player's courses, highlights and records (v/<version>/player/<ctx>/<key>.json), fetched when needed.
function mine() {
  const p = state.data.players.find(p => p.name === state.me);
  if (!p || !p.file) return { none: true };
  const key = `${site.version}|${state.ctx}|${p.file}`;
  if (state.mine && state.mine.key === key) return state.mine;
  state.mine = { key, loading: true };
  getJSON(`v/${site.version}/player/${state.ctx || "all"}/${p.file}.json`).then(
    data => { if (state.mine.key === key) { state.mine = { key, data }; render(); } },
    async e => {
      if (state.mine.key !== key) return;
      // Open across a couple of publishes: this version is gone, so reload onto the newest.
      const latest = await getJSON("latest.json", { cache: "no-store" }).catch(() => null);
      if (state.mine.key !== key) return;
      if (latest && latest.version !== site.version) { state.mine = null; load(); return; }
      state.mine = { key, error: e.message };
      render();
    });
  return state.mine;
}

// For tabs that need the player file: its data, or the page to show while it loads.
function withMine(title, fn) {
  const m = mine();
  if (m.none) return `<h2>${title}</h2><p class="empty">${esc(state.me)} has nothing in this view.</p>`;
  if (m.loading) return `<h2>${title}</h2><p class="sub">Loading…</p>`;
  if (m.error) return `<h2>${title}</h2><div class="err">${esc(m.error)}</div>`;
  return fn(m.data);
}

const meTitle = (t) => state.me ? `${t} · ${esc(state.me)}` : t;

// The link to a view: the current one, or (with `v`, the tab's own keys) a round, hole, shot… on `tab`.
function hashFor(tab = state.tab, v = null) {
  const q = new URLSearchParams();
  q.set("player", state.me);   // empty = Everyone, so the link doesn't fall back to the recipient's pick
  if (state.ctx) q.set("ctx", state.ctx);
  const set = (k, x) => { if (x !== null && x !== undefined && x !== "") q.set(k, String(x)); };
  if (v) for (const [k, x] of Object.entries(v)) k === "player" ? q.set(k, x) : set(k, x);
  else if (tab === "shots") { for (const k of SHOT_LINK_KEYS) set(k, state.shotFilter[k]); set("shot", state.shotOpen); }
  else if (tab === "rounds" && state.round) { set("round", state.round); set("hole", state.replayHole); }
  else if (tab === "courses") set("course", state.course);
  else if (tab === "versus") { set("a", state.versus[0]); set("b", state.versus[1]); }
  else if (tab === "players" && !state.me) set("show", state.player);
  else if (tab === "highlights" && state.period !== "1y") set("period", state.period);
  else if (tab === "vods" && state.vod) { set("vod", state.vod.session); if (state.vod.at) set("at", state.vod.at); }
  return "#" + tab + "?" + q;
}

function writeHash() {
  const h = hashFor();
  if (location.hash !== h) history.replaceState(null, "", h);
}

// A share button: the phone's share sheet, else the link copied.
const shareBtn = (hash, title, label = "🔗") =>
  `<button class="link share" data-link="${esc(hash)}" data-linktitle="${esc(title)}" title="Share a link to ${esc(title)}">${label}</button>`;
async function shareLink(hash, title, btn) {
  const url = location.href.split("#")[0] + hash;
  if (navigator.share && matchMedia("(pointer: coarse)").matches) {
    try { await navigator.share({ url, title }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {}
  const was = btn.innerHTML;
  btn.textContent = ok ? "Link copied" : "Couldn't copy";
  setTimeout(() => (btn.innerHTML = was), 1800);
}

// Where a moment (a shot's or a hole's first time, epoch seconds) is in the kept streams: that
// stream and a few seconds before, to see the setup. Nothing once the stream is gone (a week).
const WATCH_LEAD = 5;
function videoAt(ts) {
  if (!ts || !state.vods) return null;
  const now = Date.now() / 1000;
  const v = state.vods.find(v => ts >= v.since && ts <= (v.ended ?? now) + 1);
  return v ? { session: v.session, at: Math.max(0, Math.round(ts - v.since - WATCH_LEAD)) } : null;
}
function watchBtn(ts, label = "▶ Watch") {
  const w = videoAt(ts);
  return w ? `<button class="link" data-vod="${esc(w.session)}" data-vodat="${w.at}" title="Watch it on the round's video">${label}</button>` : "";
}
// A shot's (or a highlight's) watch and share buttons. Its link is for everyone: the picked player
// may not be the one who hit it (an opponent's shot on a round they played in).
const shotActions = (x, title = "this shot") => x && x.id
  ? ` <span class="acts">${watchBtn(x.ts, "▶")}${shareBtn(hashFor("shots", { shot: x.id, player: "" }), title)}</span>` : "";

// Rounds that ended after this device's last visit are tagged new; the mark moves on once seen.
function markSeen() {
  const newest = Math.max(0, ...state.data.rounds.map(r => r.ended || 0));
  if (newest > (Number(store.get("shotcast.seen")) || 0)) store.set("shotcast.seen", String(newest));
}

const shownSort = {};   // each table's sort as drawn, defaults included, so a header click flips it
function sortable(id, rows, cols, rowHtml, opts = {}) {
  const s = state.sort[id] || { key: opts.key, dir: opts.dir || 1 };
  shownSort[id] = s;
  const sorted = [...rows];
  if (s.key) {
    const col = cols.find(c => c.key === s.key) || {};
    const val = col.val || (r => r[s.key]);
    sorted.sort((a, b) => {
      const x = val(a), y = val(b);
      if (x === y) return 0;
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      return (x < y ? -1 : 1) * s.dir;
    });
  }
  const head = cols.map(c => `<th class="${c.cls || ""}" data-sort="${id}:${c.key}" title="${esc(c.title || "")}">${c.label}${s.key === c.key ? (s.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${sorted.map(rowHtml).join("") || `<tr><td colspan="${cols.length}" class="empty">${opts.empty || "Nothing here yet."}</td></tr>`}</tbody></table>`;
}

function scoreCell(score, par) {
  const d = score - par;
  const cls = d <= -2 ? "eagle" : d === -1 ? "birdie" : d === 1 ? "bogey" : d >= 2 ? "double" : "";
  return `<span class="s ${cls}">${score}</span>`;
}

// A scramble partner's share of the team's strokes: shots played on from their ball, plus the gimme
// and penalty strokes that ball cost, so the partners' counts add up to the score.
function usedText(pl) {
  const n = (k, one) => `${k} ${one}${k === 1 ? "" : "s"}`;
  return n(pl.used, "shot") + " used" + (pl.used_gimmes ? ` + ${n(pl.used_gimmes, "gimme")}` : "")
    + (pl.used_pens ? ` + ${n(pl.used_pens, "penalty").replace("penaltys", "penalties")}` : "");
}

// A scramble round's strokes by partner, summed over the holes with shot data.
function shotsUsed(r, reps) {
  if (!reps || r.format !== "scramble") return "";
  const tot = {}, holes = Object.values(reps).filter(rp => rp.players.some(p => p.used != null));
  for (const rp of holes) for (const p of rp.players) if (p.used != null) {
    const t = tot[p.name] || (tot[p.name] = { used: 0, used_gimmes: 0, used_pens: 0 });
    t.used += p.used; t.used_gimmes += p.used_gimmes || 0; t.used_pens += p.used_pens || 0;
  }
  if (!holes.length) return "";
  const missing = (r.card || []).length - holes.length;
  return `<p class="sub">Shots used: ${Object.entries(tot).map(([name, t]) => `${esc(name)} ${t.used + t.used_gimmes + t.used_pens}`
    + (t.used_gimmes || t.used_pens ? ` (${usedText(t)})` : "")).join(" · ")}${missing > 0 ? ` · ${missing} hole${missing > 1 ? "s" : ""} without shot data` : ""}</p>`;
}

function scorecard(holes, replays) {
  if (!holes || !holes.length) return '<p class="empty">No hole-by-hole card recorded.</p>';
  const par = holes.reduce((a, h) => a + h.par, 0), gross = holes.reduce((a, h) => a + h.score, 0);
  const head = h => replays && replays[h.hole]
    ? `<button class="link${state.replayHole === h.hole ? " on" : ""}" data-replay="${h.hole}" title="Replay this hole">${h.hole}</button>` : h.hole;
  return `<table class="scorecard"><tr><th>Hole</th>${holes.map(h => `<th>${head(h)}</th>`).join("")}<th>Tot</th></tr>
    <tr><td class="sub">Par</td>${holes.map(h => `<td class="sub">${h.par}</td>`).join("")}<td class="sub">${par}</td></tr>
    <tr><td>Score</td>${holes.map(h => `<td>${scoreCell(h.score, h.par)}</td>`).join("")}<td><b>${gross}</b> <span class="sub">${toPar(gross - par)}</span></td></tr></table>`;
}

// A hole drawn from the logged ball positions, seen from above and turned so the tee is at the bottom
// and the pin at the top. World units are metres (x, z); an aim is the player's minimap click.
const REPLAY_COLORS = ["#5fc58a", "#6fb3ff", "#ffb74d", "#e57373", "#ba68c8", "#4dd0e1"];
// Animated, it plays the shots in turn (every player's nth shot together), each line drawing out
// behind a ball, and ends on the static drawing. `colors` gives each player one colour for the whole
// round; `only` draws just that player's shots (the frame still fits everyone's, so it doesn't jump).
function replaySvg(rp, animate = false, { colors = {}, only = null, focus = null, actions = "" } = {}) {
  const color = (pl, i) => colors[pl.name] || REPLAY_COLORS[i % REPLAY_COLORS.length];
  const drawn = only ? rp.players.filter(p => p.name === only) : rp.players;
  const toggle = focus && rp.players.length > 1 && rp.players.some(p => p.name === focus)
    ? ` · <button class="link" data-replayonly>${only ? "Show everyone" : `Only ${esc(focus)}`}</button>` : "";
  const pts = [rp.tee, rp.pin, ...rp.players.flatMap(p => p.shots.flatMap(s => [s.from, s.to, s.aim]))].filter(Boolean);
  if (pts.length < 2) return '<p class="empty">Not enough positions logged to draw this hole.</p>';
  const a = rp.tee || pts[0], b = rp.pin || pts[pts.length - 1];
  let fx = b[0] - a[0], fz = b[1] - a[1];
  const n = Math.hypot(fx, fz) || 1; fx /= n; fz /= n;
  // Left-handed Unity axes: a player facing (fx, fz) has (fz, -fx) on the right.
  const loc = p => { const dx = p[0] - a[0], dz = p[1] - a[1]; return [dx * fz - dz * fx, -(dx * fx + dz * fz)]; };
  const L = pts.map(loc), xs = L.map(p => p[0]), ys = L.map(p => p[1]);
  const pad = 14, minY = Math.min(...ys) - pad, h = Math.max(...ys) + pad - minY;
  // At least half as wide as long, centred, so a straight hole isn't a sliver.
  const w = Math.max(Math.max(...xs) - Math.min(...xs) + 2 * pad, h / 2, 60);
  const minX = (Math.max(...xs) + Math.min(...xs)) / 2 - w / 2;
  const k = Math.min(320 / w, 520 / h), W = Math.round(w * k), H = Math.round(h * k);
  const P = p => { const [x, y] = loc(p); return [((x - minX) * k).toFixed(1), ((y - minY) * k).toFixed(1)]; };
  let g = "";
  if (rp.map && rp.tee && rp.pin) {
    // GSPro's minimap, turned and scaled so its ball sits on the tee and its pin on the pin. Both
    // frames have y down and the golfer's right to +x, so it's a turn and a scale, never a flip.
    const m = rp.map, vx = m.pin[0] - m.ball[0], vy = m.pin[1] - m.ball[1];
    const s = Math.hypot(rp.pin[0] - rp.tee[0], rp.pin[1] - rp.tee[1]) / (Math.hypot(vx, vy) || 1) * k;
    const turn = -90 - Math.atan2(vy, vx) * 180 / Math.PI, [tx, ty] = P(rp.tee);
    g += `<image href="${m.src}" width="${m.w}" height="${m.h}" opacity=".8" transform="translate(${tx} ${ty}) rotate(${turn.toFixed(2)}) scale(${s.toFixed(4)}) translate(${-m.ball[0]} ${-m.ball[1]})"/>`;
  }
  if (rp.tee) { const [x, y] = P(rp.tee); g += `<rect x="${x - 4}" y="${y - 4}" width="8" height="8" fill="#ddd"><title>Tee</title></rect>`; }
  // Each shot number's start time: a step the length of its longest shot's flight, putts quicker.
  const starts = {}; let clock = 0.4;
  for (const n of [...new Set(drawn.flatMap(p => p.shots.map(s => s.n)))].sort((x, y) => x - y)) {
    starts[n] = clock; clock += drawn.some(p => p.shots.some(s => s.n === n && !s.putt)) ? 0.95 : 0.75;
  }
  const at = (cls, n, lag = 0, more = "") => animate ? ` class="${cls}" style="${more}animation-delay:${((starts[n] ?? 0) + lag).toFixed(2)}s"` : "";
  let balls = "";
  rp.players.forEach((pl, i) => {
    if (!drawn.includes(pl)) return;
    const c = color(pl, i);
    for (const s of pl.shots) {
      const tip = esc(`${pl.name} · shot ${s.n}${s.club ? " · " + s.club : ""}${s.lie ? " from the " + s.lie : ""}${s.to_pin != null ? ` · ${s.to_pin} yd to the pin` : ""}`);
      if (s.from && s.aim) { const [x1, y1] = P(s.from), [x2, y2] = P(s.aim);
        g += `<g${at("rp-in", s.n)}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-opacity=".45" stroke-dasharray="3 3"/><circle cx="${x2}" cy="${y2}" r="2.5" fill="none" stroke="${c}" stroke-opacity=".6"><title>${tip} · aim</title></circle></g>`; }
      if (s.from && s.to) { const [x1, y1] = P(s.from), [x2, y2] = P(s.to);
        const { d, len } = flightPath(+x1, +y1, +x2, +y2, s.putt ? 0 : (s.bend || 0) * k);
        g += `<path d="${d}" fill="none" stroke="${c}" stroke-width="${s.putt ? 1.5 : 2.5}"${at("rp-draw", s.n, 0.3, `--len:${(len + 1).toFixed(1)};`)}><title>${tip}${s.shape ? " · " + esc(s.shape) : ""}</title></path>`;
        const delay = ((starts[s.n] ?? 0) + 0.3).toFixed(2);
        if (animate) balls += `<circle r="2.5" fill="#fff" stroke="#111" stroke-width=".8" class="rp-ball" style="animation-delay:${delay}s"><animateMotion path="${d}" begin="${delay}s" dur=".55s" fill="freeze" calcMode="spline" keyTimes="0;1" keyPoints="0;1" keySplines=".42 0 .58 1"/></circle>`;
        if (s.penalty) g += `<g${at("rp-in", s.n, 0.85)}><path d="M${x2 - 4},${y2 - 4} l8,8 m0,-8 l-8,8" stroke="#e53935" stroke-width="2.2" stroke-linecap="round"/><title>${tip} · into the penalty area (penalty stroke, then the drop)</title></g>`; }
      if (s.from) { const [x, y] = P(s.from); g += `<g${at("rp-in", s.n)}><circle cx="${x}" cy="${y}" r="3.5" fill="${c}" stroke="#111"><title>${tip}</title></circle>`;
        g += `<text x="${+x + 6}" y="${+y + 3}" fill="${c}" font-size="10" paint-order="stroke" stroke="#111" stroke-width="2.5">${s.n ?? ""}${s.club && !s.putt ? " " + esc(s.club) : ""}</text></g>`; }
    }
  });
  if (!rp.pin) g += balls;
  if (rp.pin) { const [x, y] = P(rp.pin);
    g += balls + `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - 16}" stroke="#eee" stroke-width="1.5"/><path d="M${x},${y - 16} l10,4 l-10,4z" fill="#e53935"/><circle cx="${x}" cy="${y}" r="2.5" fill="#eee"><title>Pin${rp.pin_estimated ? " (estimated)" : ""}</title></circle>`; }
  // A scale bar: the round number of yards nearest a fifth of the drawing's length.
  const yd = [10, 25, 50, 100, 150, 200].reduce((a, v) => Math.abs(v - h * 1.0936 / 5) < Math.abs(a - h * 1.0936 / 5) ? v : a);
  const bar = yd / 1.0936 * k;
  g += `<line x1="8" y1="${H - 8}" x2="${(8 + bar).toFixed(1)}" y2="${H - 8}" stroke="#8fa59b" stroke-width="2"/><text x="8" y="${H - 13}" fill="#8fa59b" font-size="10">${yd} yd</text>`;
  const legend = rp.players.map((pl, i) => `<span style="color:${color(pl, i)}${drawn.includes(pl) ? "" : ";opacity:.45"}">● ${esc(pl.name)}${pl.used != null ? ` · ${usedText(pl)}` : pl.strokes ? ` · ${pl.strokes}${pl.gimmes ? ` (incl. ${pl.gimmes} gimme${pl.gimmes > 1 ? "s" : ""})` : ""}` : ""}</span>`).join(" &nbsp;");
  const notes = [rp.pin ? (rp.pin_estimated ? "Pin estimated from the shots' distances." : "") : "Pin position unknown.",
                 drawn.some(p => p.shots.some(s => s.aim)) ? "Dashed: where the player aimed." : "",
                 drawn.some(p => p.shots.some(s => s.penalty)) ? "✕: where a ball went into a penalty area (the next shot is the drop)." : "",
                 drawn.some(p => p.shots.some(s => s.bend)) ? "Full shots curve by their shape, estimated from the spin axis." : "",
                 rp.map && rp.map.approx ? "Map from another round here: its tee, pin dot and yardages may differ a little." : ""].filter(Boolean).join(" ");
  return `<div class="replay"><div class="sub">${esc(rp.course)} · hole ${rp.hole}${rp.par ? ` · par ${rp.par}` : ""}
    · <button class="link" data-replayagain title="Play the hole again">↻ Play again</button>${toggle}${actions}</div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}</svg>
    <div class="sub">${legend}</div>${notes ? `<div class="sub">${notes}</div>` : ""}</div>`;
}

// A shot's flight from (x1, y1) to (x2, y2): a quadratic curve bowed `bend` pixels to the right of the
// straight line at its middle (negative: to the left), or the straight line. Screen y runs down, so
// the right of a shot heading (dx, dy) is (-dy, dx). Its length is for the line-drawing animation.
function flightPath(x1, y1, x2, y2, bend) {
  const dx = x2 - x1, dy = y2 - y1, n = Math.hypot(dx, dy);
  if (!bend || n < 1 || Math.abs(bend) < 0.3) return { d: `M${x1},${y1} L${x2},${y2}`, len: n };
  // A quadratic's middle is halfway to its control point, so the control point sits twice the bow out.
  const cx = (x1 + x2) / 2 - dy / n * 2 * bend, cy = (y1 + y2) / 2 + dx / n * 2 * bend;
  let len = 0, px = x1, py = y1;
  for (let i = 1; i <= 16; i++) {
    const t = i / 16, u = 1 - t, qx = u * u * x1 + 2 * u * t * cx + t * t * x2, qy = u * u * y1 + 2 * u * t * cy + t * t * y2;
    len += Math.hypot(qx - px, qy - py); px = qx; py = qy;
  }
  return { d: `M${x1},${y1} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2},${y2}`, len };
}

// A small line chart: one point per night.
function lineChart(points, key, title, fmt = v => v, lowerIsBetter = false) {
  const pts = points.filter(p => p[key] !== null && p[key] !== undefined);
  if (!pts.length) return `<div class="chart"><div class="sub">${title}</div><p class="empty">No data yet.</p></div>`;
  const W = 300, H = 120, pad = { l: 36, r: 22, t: 12, b: 22 };
  const vals = pts.map(p => p[key]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const span = hi - lo; lo -= span * 0.15; hi += span * 0.15;
  const x = i => pad.l + (pts.length === 1 ? (W - pad.l - pad.r) / 2 : i * (W - pad.l - pad.r) / (pts.length - 1));
  const y = v => pad.t + (hi - v) * (H - pad.t - pad.b) / (hi - lo);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join("");
  const first = vals[0], last = vals[vals.length - 1];
  const better = pts.length > 1 && (lowerIsBetter ? last < first : last > first);
  const worse = pts.length > 1 && (lowerIsBetter ? last > first : last < first);
  return `<div class="chart"><div class="sub">${title} <span class="${better ? "good" : worse ? "bad" : ""}">${fmt(last)}</span></div>
    <svg viewBox="0 0 ${W} ${H}">
      <text x="2" y="${y(Math.max(...vals)) + 4}" fill="#8fa59b" font-size="10">${fmt(Math.max(...vals))}</text>
      <text x="2" y="${y(Math.min(...vals)) + 4}" fill="#8fa59b" font-size="10">${fmt(Math.min(...vals))}</text>
      <path d="${path}" fill="none" stroke="#5fc58a" stroke-width="2"/>
      ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[key])}" r="3" fill="#5fc58a"><title>${p.date}: ${fmt(p[key])}</title></circle>`).join("")}
      ${pts.map((p, i) => (pts.length <= 6 || i === 0 || i === pts.length - 1) ? `<text x="${x(i)}" y="${H - 6}" fill="#8fa59b" font-size="10" text-anchor="${i === pts.length - 1 && pts.length > 1 ? "end" : i === 0 && pts.length > 1 ? "start" : "middle"}">${p.date.slice(5)}</text>` : "").join("")}
    </svg></div>`;
}

// A handicap index as golfers write it: better than scratch is "+".
const hcp = v => v === null || v === undefined ? "–" : v < 0 ? "+" + (-v).toFixed(1) : v.toFixed(1);

const SG_LABELS = { off_tee: "Off the tee", approach: "Approach", around_green: "Around the green", putting: "Putting", total: "Total" };
function sgBars(sg) {
  if (!sg) return '<p class="empty">Not enough finished holes yet.</p>';
  const max = Math.max(1, ...Object.values(sg.per_nine).map(Math.abs));
  return `<div class="sg">${Object.entries(SG_LABELS).map(([k, label]) => {
    const v = sg.per_nine[k], w = Math.abs(v) / max * 50;
    const style = v >= 0 ? `left:50%;width:${w}%;background:var(--accent)` : `left:${50 - w}%;width:${w}%;background:var(--bad)`;
    return `<div${k === "total" ? ' style="font-weight:600"' : ""}>${label}</div><div class="sgbar"><span class="mid"></span><i style="${style}"></i></div>
      <div class="${v >= 0 ? "good" : "bad"}" style="text-align:right">${signed(v)}</div>`;
  }).join("")}</div>
  <p class="sub">Strokes gained per nine holes against an approximate PGA Tour baseline (Broadie): negative is shots lost to a tour pro.
  ${sg.holes} finished holes. GSPro's gimmes make putting look a little better than real life.</p>`;
}

function gapChart(clubs) {
  const cs = clubs.filter(c => c.carry);
  if (!cs.length) return '<p class="empty">No launch-monitor carries yet.</p>';
  const max = Math.max(...cs.map(c => c.carry_max || c.carry)) * 1.05;
  const pct = v => (100 * v / max).toFixed(1) + "%";
  return `<div class="gap">${cs.map(c => `<div>${esc(c.club)}</div><div class="gaptrack" title="${c.n} swings; middle half ${c.carry_lo}–${c.carry_hi} yd">
      <span class="rng" style="left:${pct(c.carry_lo)};width:${pct(Math.max(1, c.carry_hi - c.carry_lo))}"></span>
      <span class="med" style="left:${pct(c.carry)}"></span>
      <span class="lbl" style="left:calc(${pct(c.carry)} + 8px)">${Math.round(c.carry)} yd</span></div>`).join("")}</div>`;
}
